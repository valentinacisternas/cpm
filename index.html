<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPM">
<meta name="theme-color" content="#0d1420">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CPM</title>
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --ink: #121a26; --muted: #6b7686; --line: #e3e8ef;
    --red: #d93f3f; --red-soft: #fbe6e6; --green: #1f9d55; --green-soft: #e3f5ea;
    --amber: #b7791f; --amber-soft: #fbf1dc; --accent: #2f6fde; --accent-soft: #e4edfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1420; --card: #161f2e; --ink: #ecf1f8; --muted: #94a0b2; --line: #243044;
      --red: #f06b6b; --red-soft: #3a1a1f; --green: #4cc382; --green-soft: #15301f;
      --amber: #e2b45c; --amber-soft: #33281a; --accent: #6b9cf0; --accent-soft: #1b2a45;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 28px; font-weight: 750; letter-spacing: -.02em; margin: 0; flex: 1; }
  .status { font-size: 12px; color: var(--muted); text-align: right; }
  .status b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .status.live b { background: var(--green); }
  .icon-btn { border: 0; background: var(--card); color: var(--ink); width: 38px; height: 38px; border-radius: 50%;
    font-size: 18px; box-shadow: 0 1px 0 var(--line); }
  main { padding: 0 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 4px 8px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
  .line { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline; }
  .line:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .dot.ok { background: var(--green); } .dot.unsure { background: var(--amber); } .dot.none { background: var(--red); } .dot.off { background: var(--line); }
  .desc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .target { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target.none { color: var(--red); font-weight: 600; }
  .summary { padding: 12px 14px; display: flex; align-items: baseline; gap: 8px; }
  .summary .big { font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .summary .sub { color: var(--muted); font-size: 14px; }
  .warn { margin: 0 14px 12px; padding: 9px 12px; border-radius: 10px; font-size: 13px; }
  .warn.red { background: var(--red-soft); color: var(--red); }
  .warn.amber { background: var(--amber-soft); color: var(--amber); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .pill.pending { background: var(--accent-soft); color: var(--accent); }
  .pill.done { background: var(--green-soft); color: var(--green); }
  .pill.bad { background: var(--red-soft); color: var(--red); }
  .pill.off { background: var(--line); color: var(--muted); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 10px; }
  .btn { border: 0; border-radius: 12px; padding: 13px 12px; font-weight: 650; font-size: 16px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.quiet { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.wide { grid-column: 1 / 3; }
  .btn[disabled] { opacity: .5; }
  .result { font-size: 13px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .result.bad { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  .older summary { list-style: none; cursor: pointer; }
  .older summary::-webkit-details-marker { display: none; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 9;
    background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px;
    transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }
  .setup { background: var(--card); border-radius: 16px; padding: 18px; border: 1px solid var(--line); margin-top: 12px; }
  .setup input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font-size: 15px; margin: 10px 0; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 4px; }
  .line.editable { cursor: pointer; }
  .line.editable:active { background: var(--bg); }
  .line.skipped .desc, .line.skipped .when { text-decoration: line-through; color: var(--muted); }
  .edited { color: var(--accent); font-weight: 600; }
  .datepick { margin: 4px 0 6px; }
  .datepick input { flex: 1; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 16px; font-family: inherit; min-height: 46px; }
  .datepick .btn { padding: 11px 14px; }
  [data-select] { cursor: pointer; }
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: #0007; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 2px; font-size: 18px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .sheet label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 2px 6px; }
  .sheet input[type=search], .sheet input[type=text], .sheet input[type=number] { width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; }
  .tickets { background: var(--card); border: 1px solid var(--line); border-radius: 12px; max-height: 34vh; overflow-y: auto; margin-top: 8px; }
  .ticket { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none;
    color: var(--ink); padding: 10px 12px; font-size: 15px; }
  .ticket:first-child { border-top: 0; }
  .ticket small { display: block; color: var(--muted); font-size: 12px; }
  .ticket[aria-pressed="true"] { background: var(--accent-soft); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .toggle { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-top: 8px; font-size: 15px; }
  .toggle input { width: 20px; height: 20px; }
  .sheet .buttons { margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>CPM</h1>
  <div class="status" id="status"><b></b>—</div>
  <button class="icon-btn" id="refresh" aria-label="Actualizar">↻</button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/*
  CPM — a tiny front end for the CPM approver that runs on the VM.
  Same idea as the Red Light app: the phone can't reach the VM, so both talk through
  two private ntfy.sh topics:
    data  (VM → app): {kind:"day"} = a drafted day and its status, {kind:"url"} = the Copilot's current link
    reply (app → VM): "approve <date> <token>", "skip <date> <token>", "refresh"
  The topic names live only in this device's storage (they arrive in the link's #fragment,
  which browsers never send to the server).
*/
const NTFY = 'https://ntfy.sh';
const DIAS_LARGO = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('d') && hash.get('r')) { store.set('d', hash.get('d')); store.set('r', hash.get('r')); history.replaceState(null, '', location.pathname); }
const cfg = { d: store.get('d') || hash.get('d'), r: store.get('r') || hash.get('r') };

// days by date, newest kept; the Copilot link
let days = {}; try { days = JSON.parse(store.get('days')) || {}; } catch {}
let copilot = store.get('copilot') || '';
let lastAt = store.get('lastAt') || '';
const pending = {};
let olderOpen = false;
document.addEventListener('toggle', (e) => { if (e.target.matches?.('details.older')) olderOpen = e.target.open; }, true);

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const duration = (l) => Math.max(0, (mins(l.end) - mins(l.start)) / 60);
const hours = (l) => (typeof l.hours === 'number' ? l.hours : duration(l));
// same grouping as the VM (cpm-daily.mjs toEntries), so an edit shows its effect at once
function toEntries(lines) {
  const groups = new Map();
  for (const l of lines) {
    const h = hours(l);
    if (l.skip || !l.ticket || h <= 0) continue;
    const key = `${l.project}|${l.ticket}|${l.chargeable}`;
    const g = groups.get(key) ?? { project: l.project, ticket: l.ticket, hours: 0 };
    g.hours += h; groups.set(key, g);
  }
  return [...groups.values()].map((g) => ({ ...g, hours: Math.round(g.hours * 100) / 100 }));
}
let catalog = []; try { catalog = JSON.parse(store.get('catalog')) || []; } catch {}
const saving = {}; // dates with an edit the VM hasn't confirmed yet; Reservar waits for it
const fmtH = (h) => `${Math.round(h * 100) / 100} h`;
const dayLabel = (key) => {
  const [y, m, d] = key.split('-').map(Number), date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 864e5);
  const base = `${DIAS_LARGO[date.getDay()]} ${d}.${m}`;
  return diff === 0 ? `Hoy · ${base}` : diff === -1 ? `Ayer · ${base}` : base;
};

const STATUS = {
  pending: ['pending', 'Por revisar'],
  booked: ['done', 'Reservado'],
  partial: ['bad', 'Reservado con errores'],
  skipped: ['off', 'Saltado'],
  blocked: ['off', 'Ya tenía reservas'],
  already: ['done', 'Ya reservado en CPM'],
  empty: ['off', 'Sin reuniones'],
};

// the day on screen: picked with the date field, otherwise the newest draft
let selected = '';
const requested = {}; // date -> asked the VM for it, waiting
const todayIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
function pick(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  selected = date;
  requested[date] = Date.now();
  render();
  send(`draft ${date}`, days[date] ? 'Actualizando ese día…' : 'Pidiendo el borrador a la VM… (menos de un minuto)');
}

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

async function send(cmd, label) {
  try {
    const r = await fetch(`${NTFY}/${cfg.r}`, { method: 'POST', body: cmd });
    if (!r.ok) throw new Error(r.status);
    toast(label);
  } catch {
    toast('No se pudo enviar. ¿Tienes internet?');
  }
}

function setStatus() {
  const el = $('#status');
  if (!lastAt) { el.className = 'status'; el.innerHTML = '<b></b>esperando datos…'; return; }
  const age = (Date.now() - new Date(lastAt)) / 6e4;
  el.className = 'status' + (age < 20 ? ' live' : '');
  el.innerHTML = `<b></b>${age < 1 ? 'ahora' : age < 60 ? `hace ${Math.round(age)} min` : age < 1440 ? `hace ${Math.round(age / 60)} h` : `hace ${Math.round(age / 1440)} d`}`;
}

function dayHtml(d, open) {
  const [cls, label] = STATUS[d.status] ?? ['off', d.status];
  const total = d.entries.reduce((s, e) => s + e.hours, 0);
  const live = d.lines.filter((l) => !l.skip);
  const missing = live.filter((l) => !l.ticket).length;
  const overlaps = live.filter((l, i) => live.some((o, j) => j !== i && mins(o.start) < mins(l.end) && mins(o.end) > mins(l.start))).length;
  const wait = pending[d.date] || (saving[d.date] && 'save');
  const editable = d.status === 'pending';

  let html = `<h2>${dayLabel(d.date)} <span class="pill ${cls}">${label}</span></h2><div class="panel">`;
  if (d.status === 'empty') return html + '<div class="summary"><span class="sub">No hay reuniones de trabajo en el calendario ese día.</span></div></div>';
  if (d.status === 'already') {
    html += `<div class="summary"><span class="big">${fmtH(total)}</span><span class="sub">ya en CPM, nada que aprobar</span></div>`;
    for (const e of d.entries) html += `<div class="result">${esc(e.project)} ${esc(e.ticket)} · ${fmtH(e.hours)}</div>`;
    return html + '</div>';
  }
  html += `<div class="summary"><span class="big">${fmtH(total)}</span><span class="sub">en ${d.entries.length} entrada${d.entries.length === 1 ? '' : 's'}</span></div>`;
  if (missing) html += `<div class="warn red">${missing} reunión${missing === 1 ? '' : 'es'} sin ticket: no se reserva${missing === 1 ? '' : 'n'}.</div>`;
  if (overlaps) html += `<div class="warn amber">${overlaps} reuniones se solapan: las horas se suman dos veces.</div>`;
  if (open) {
    d.lines.forEach((l, i) => {
      const kind = l.skip ? 'off' : !l.ticket ? 'none' : l.tentative ? 'unsure' : 'ok';
      const target = l.skip ? 'No se reserva'
        : l.ticket ? `${esc(l.project)} · ${esc(l.ticket)} · <span class="${typeof l.hours === 'number' ? 'edited' : ''}">${fmtH(hours(l))}</span>${l.chargeable === false ? ' · no facturable' : ''}`
        : 'Sin ticket — toca para asignar';
      html += `<div class="line${editable ? ' editable' : ''}${l.skip ? ' skipped' : ''}" ${editable ? `data-line="${d.date}|${i}"` : ''}>
        <span class="dot ${kind}"></span><span class="desc">${esc(l.description)}</span>
        <span class="when">${l.start}–${l.end}</span>
        <span class="target${l.ticket || l.skip ? '' : ' none'}">${target}</span></div>`;
    });
  }
  for (const r of d.results ?? []) html += `<div class="result${r.ok ? '' : ' bad'}">${r.ok ? '✓' : '✗'} ${esc(r.ticket)} ${fmtH(r.hours)}${r.ok ? '' : ': ' + esc(r.error)}</div>`;
  html += '</div>';

  if (d.status === 'skipped' || d.status === 'blocked') {
    html += `<div class="buttons"><button class="btn quiet wide" data-reopen="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'reopen' ? 'Reabriendo…' : '↩︎ Reabrir para revisar'}</button></div>`;
  }
  if (editable) {
    html += `<div class="buttons">
      <button class="btn primary" data-approve="${d.date}" ${wait || !d.entries.length ? 'disabled' : ''}>${wait === 'approve' ? 'Reservando…' : wait === 'save' ? 'Guardando…' : 'Reservar'}</button>
      <button class="btn quiet" data-skip="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'skip' ? 'Saltando…' : 'Saltar'}</button>
    </div>
    <p class="note">Toca una reunión para cambiar su ticket u horas.</p>`;
  }
  return html;
}

function render() {
  setStatus();
  const main = $('#main');
  if (!cfg.d || !cfg.r) return renderSetup(main);

  const sorted = Object.values(days).sort((a, b) => b.date.localeCompare(a.date));
  const current = selected || sorted[0]?.date || '';
  for (const k in requested) if (days[k]?.at && new Date(days[k].at) > requested[k] - 5000 || Date.now() - requested[k] > 180000) delete requested[k];

  let html = `<div class="row datepick"><input type="date" id="date" value="${current || todayIso()}" max="${todayIso()}">
    <button class="btn quiet" id="go">Ver día</button></div>`;
  if (!current) html += '<p class="empty">Todavía no hay borradores.<br><br>Llegan de lunes a viernes a las 17:30, o elige un día arriba.</p>';
  else if (!days[current]) {
    html += `<h2>${dayLabel(current)}</h2><p class="empty">${requested[current] ? 'La VM está armando el borrador… llega en menos de un minuto.' : 'No hay borrador para este día. Pulsa «Ver día».'}</p>`;
  } else {
    html += dayHtml(days[current], true);
    if (requested[current]) html += '<p class="note">Actualizando desde la VM…</p>';
  }
  if (sorted.length) {
    html += `<div class="buttons"><button class="btn quiet wide" id="copilot" ${copilot ? '' : 'disabled'}>✏️ Editar en el Copilot</button></div>`;
    const others = sorted.filter((d) => d.date !== current).slice(0, 10);
    if (others.length) {
      html += `<details class="older"${olderOpen ? ' open' : ''}><summary><h2>Otros días ▾</h2></summary>`;
      for (const d of others) html += `<div data-select="${d.date}">${dayHtml(d, false)}</div>`;
      html += '</details>';
    }
  }
  if (!copilot) html += '<p class="note">El enlace al Copilot llega con ↻.</p>';
  main.innerHTML = html;
}

function renderSetup(main) {
  main.innerHTML = `<div class="setup"><b>Falta conectar la app</b>
    <p class="note">Abre esta página con el enlace que te dio Claude (el que termina en <code>#d=…&amp;r=…</code>), o pégalo aquí:</p>
    <input id="link" placeholder="https://…#d=…&r=…" autocomplete="off">
    <button class="btn primary" id="save">Conectar</button></div>`;
  $('#save').onclick = () => {
    const h = new URLSearchParams(($('#link').value.split('#')[1] || ''));
    if (h.get('d') && h.get('r')) { store.set('d', h.get('d')); store.set('r', h.get('r')); location.reload(); }
    else toast('Ese enlace no tiene los datos de conexión.');
  };
}

/* ---------- editing a line ---------- */

function openEditor(date, i) {
  const d = days[date], l = d?.lines[i]; if (!l) return;
  const draft = { project: l.project || '', ticket: l.ticket || '', chargeable: l.chargeable !== false,
    hours: typeof l.hours === 'number' ? l.hours : null, skip: !!l.skip };
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="Editar reunión">
    <h3>${esc(l.description)}</h3>
    <div class="sub">${l.start}–${l.end} · ${fmtH(duration(l))} en el calendario</div>
    <label for="q">Ticket</label>
    <input type="search" id="q" placeholder="Buscar proyecto, ticket o asunto" autocomplete="off">
    <div class="tickets" id="tickets"></div>
    <label for="manual">…o escríbelo (número del ticket)</label>
    <div class="row"><input type="text" id="manual" inputmode="numeric" placeholder="#12345"></div>
    <label for="hrs">Horas a reservar</label>
    <div class="row"><input type="number" id="hrs" min="0" max="24" step="0.25" inputmode="decimal"><button class="btn quiet" id="reset">Duración</button></div>
    <div class="toggle"><span>Facturable</span><input type="checkbox" id="charge"></div>
    <div class="toggle"><span>No reservar esta reunión</span><input type="checkbox" id="skipLine"></div>
    <div class="buttons"><button class="btn quiet" id="cancel">Cancelar</button><button class="btn primary" id="ok">Guardar</button></div>
  </div>`;
  document.body.appendChild(bg);
  const q = bg.querySelector('#q'), list = bg.querySelector('#tickets'), manual = bg.querySelector('#manual');
  const hrs = bg.querySelector('#hrs'), charge = bg.querySelector('#charge'), skipLine = bg.querySelector('#skipLine');
  hrs.value = draft.hours ?? Math.round(duration(l) * 100) / 100;
  charge.checked = draft.chargeable; skipLine.checked = draft.skip;

  const options = [...catalog];
  if (draft.ticket && !options.some((r) => r[1] === draft.ticket)) options.unshift([draft.project, draft.ticket, '', draft.chargeable ? 1 : 0]);
  function drawList() {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const rows = options.filter((r) => words.every((w) => r.join(' ').toLowerCase().includes(w)));
    list.innerHTML = rows.length ? rows.map((r) => `<button class="ticket" data-t="${esc(r[1])}" aria-pressed="${r[1] === draft.ticket}">
      ${esc(r[1])} · ${esc(r[0])}<small>${esc(r[2] || ' ')}</small></button>`).join('')
      : `<p class="note">${catalog.length ? 'Nada coincide. Escribe el número abajo.' : 'La lista de tickets llega con ↻.'}</p>`;
  }
  drawList();
  q.addEventListener('input', drawList);
  list.addEventListener('click', (e) => {
    const t = e.target.closest('.ticket'); if (!t) return;
    const r = options.find((x) => x[1] === t.dataset.t);
    draft.ticket = r[1]; draft.project = r[0]; draft.chargeable = !!r[3]; charge.checked = draft.chargeable;
    manual.value = ''; drawList();
  });
  manual.addEventListener('input', () => {
    const n = manual.value.replace(/\D/g, '');
    if (n) { draft.ticket = '#' + n; const known = catalog.find((r) => r[1] === draft.ticket); draft.project = known ? known[0] : ''; drawList(); }
  });
  bg.querySelector('#reset').onclick = () => { hrs.value = Math.round(duration(l) * 100) / 100; draft.hours = null; };
  hrs.addEventListener('input', () => { draft.hours = hrs.value === '' ? null : Number(hrs.value); });
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  bg.querySelector('#cancel').onclick = close;
  bg.querySelector('#ok').onclick = () => {
    const change = { i };
    if (draft.ticket !== (l.ticket || '') || draft.project !== (l.project || '')) { change.ticket = draft.ticket; change.project = draft.project; }
    if (charge.checked !== (l.chargeable !== false)) change.chargeable = charge.checked;
    const h = draft.hours === null || Math.abs(draft.hours - duration(l)) < 0.001 ? null : draft.hours;
    if (h !== (typeof l.hours === 'number' ? l.hours : null)) change.hours = h;
    if (skipLine.checked !== !!l.skip) change.skip = skipLine.checked;
    close();
    if (Object.keys(change).length === 1) return;
    if (change.hours !== undefined && change.hours !== null && !(change.hours >= 0 && change.hours <= 24)) return toast('Horas entre 0 y 24.');

    // show it at once; the VM's republished draft replaces this within a minute.
    // Re-read the day: a snapshot may have replaced it while the sheet was open.
    const day = days[date], cur = day?.lines[i]; if (!cur) return;
    if (change.ticket !== undefined) Object.assign(cur, { ticket: change.ticket, project: change.project, tentative: false });
    if (change.chargeable !== undefined) cur.chargeable = change.chargeable;
    if (change.hours !== undefined) { if (change.hours === null) delete cur.hours; else cur.hours = change.hours; }
    if (change.skip !== undefined) cur.skip = change.skip;
    day.entries = toEntries(day.lines);
    saving[date] = true;
    store.set('days', JSON.stringify(days));
    render();
    send(`edit ${date} ${day.token} ${JSON.stringify([change])}`, 'Guardando en la VM…');
  };
}

$('#main').addEventListener('click', (e) => {
  const line = e.target.closest('[data-line]');
  if (line) { const [date, i] = line.dataset.line.split('|'); return openEditor(date, Number(i)); }
  const b = e.target.closest('button');
  if (b?.id === 'go') return pick($('#date').value);
  const other = e.target.closest('[data-select]');
  if (other && !b) { selected = other.dataset.select; window.scrollTo(0, 0); return render(); }
  if (!b) return;
  if (b.id === 'copilot' && copilot) return window.open(copilot, '_blank');
  const date = b.dataset.approve || b.dataset.skip || b.dataset.reopen; if (!date) return;
  const d = days[date]; if (!d) return;
  if (b.dataset.reopen) {
    pending[date] = 'reopen'; render();
    return send(`reopen ${date} ${d.token}`, 'Reabriendo… llega en menos de un minuto');
  }
  if (b.dataset.approve) {
    if (!confirm(`¿Reservar ${fmtH(d.entries.reduce((s, x) => s + x.hours, 0))} en CPM para el ${dayLabel(date)}?`)) return;
    pending[date] = 'approve'; render();
    return send(`approve ${date} ${d.token}`, 'Reservando… la confirmación llega en menos de un minuto');
  }
  pending[date] = 'skip'; render();
  send(`skip ${date} ${d.token}`, 'Saltado. Puedes reservarlo luego en el Copilot.');
});

$('#main').addEventListener('change', (e) => { if (e.target.id === 'date') pick(e.target.value); });
$('#refresh').onclick = () => { if (cfg.r) send('refresh', 'Pidiendo datos a la VM…'); load(); };

function accept(raw) {
  let m; try { m = JSON.parse(raw); } catch { return; }
  if (m.v !== 1) return;
  if (m.kind === 'url' && m.url) { copilot = m.url; store.set('copilot', copilot); }
  if (m.kind === 'catalog' && Array.isArray(m.rows)) { catalog = m.rows; store.set('catalog', JSON.stringify(catalog)); }
  if (m.kind === 'day' && m.date) {
    const prev = days[m.date];
    // while an edit is unconfirmed, only a snapshot newer than the edited copy counts
    // (replays of the old one would undo the edit on screen)
    if (prev && m.at <= prev.at) return;
    delete saving[m.date];
    days[m.date] = m;
    if (m.status !== 'pending' || pending[m.date] === 'reopen') delete pending[m.date];
    const keep = Object.keys(days).sort().slice(-30);
    days = Object.fromEntries(keep.map((k) => [k, days[k]]));
    store.set('days', JSON.stringify(days));
  }
  if (!lastAt || m.at > lastAt) { lastAt = m.at; store.set('lastAt', lastAt); }
  render();
}

async function load() {
  if (!cfg.d) return render();
  try {
    const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=all`);
    const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
    for (const m of msgs) accept(m.message);
  } catch {}
  render();
}

let es;
function live() {
  if (!cfg.d || es) return;
  es = new EventSource(`${NTFY}/${cfg.d}/sse`);
  es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') accept(m.message); } catch {} };
  es.onerror = () => { es.close(); es = null; setTimeout(live, 5000); };
}

render(); load(); live();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); live(); } });
setInterval(setStatus, 30000);
</script>
</body>
</html>
