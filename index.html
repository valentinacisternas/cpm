  };
}

/* ---------- editing a meeting / adding an entry ---------- */

// same word splitting as the VM's matcher (lib/suggest.js), to rank a project's tickets
const STOP = new Set(['the', 'and', 'with', 'for', 'call', 'meeting', 'meet', 'weekly', 'daily', 'sync', 'catch', 'up', 'review', 'session',
  'workshop', 'std', 'standup', 'de', 'la', 'el', 'con', 'reunion', 'llamada', 'termin', 'besprechung', 'want', 'production', 'processor']);
const words = (s) => [...new Set(String(s ?? '').toLowerCase().split(/[^a-z0-9äöüáéíóúñ]+/i).filter((t) => t.length > 2 && !STOP.has(t)))];
const projectIdOf = (name) => projects.find((p) => p[1].trim() === String(name ?? '').trim())?.[0] ?? '';
const projectName = (id) => projects.find((p) => String(p[0]) === String(id))?.[1] ?? '';

// budget left on a ticket row [ticket, subject, estimated, spent, mine]
function budgetTag(r, want = 0) {
  if (r[2] == null || r[2] === 0) return `<span class="bud">${T('sin estimado', 'no estimate')}</span>`;
  const left = round2(r[2] - r[3]);
  const cls = left <= 0 ? 'red' : left < Math.max(want, 2) ? 'amber' : 'green';
  return `<span class="bud ${cls}">${left <= 0 ? T(`sin budget (${num(left)} h)`, `no budget (${num(left)} h)`) : T(`quedan ${num(left)} h`, `${num(left)} h left`)}</span>`;
}

function askTickets(id, force = false) {
  if (!id) return;
  const t = ticketsByProject[id];
  if (!force && t && Date.now() - t.fetched < 15 * 60e3) return;
  if (ticketAsked[id] && Date.now() - ticketAsked[id] < 20000) return;
  ticketAsked[id] = Date.now();
  send(`tickets ${id}`);
}

function openEditor(date, i) {
  const d = days[date];
  const adding = i == null;
  const l = adding ? { start: '', end: '', manual: true, description: '', project: '', ticket: '', chargeable: true, hours: 1 } : d?.lines[i];
  if (!l) return;
  const manual = !!l.manual;
  const draft = { project: (l.project || '').trim(), ticket: l.ticket || '', chargeable: l.chargeable !== false,
    hours: typeof l.hours === 'number' ? l.hours : null, description: l.description || '' };
  if (!projects.length) send('projects');
  let pid = projectIdOf(draft.project);
  const opt = (p) => `<option value="${p[0]}">${esc(pname(p[1]))}</option>`;
  // the options are rebuilt when your project list arrives while the editor is open
  const projectOptions = () => {
    const recent = projects.filter((p) => p[2]), other = projects.filter((p) => !p[2]);
    return `<option value="">${T('— Tickets recientes de todos los proyectos —', '— Recent tickets, all projects —')}</option>
      ${recent.length ? `<optgroup label="${T('Usados este año', 'Used this year')}">${recent.map(opt).join('')}</optgroup>` : ''}
      ${other.length ? `<optgroup label="${T('Otros proyectos', 'Other projects')}">${other.map(opt).join('')}</optgroup>` : ''}
      ${projects.length ? '' : `<option value="" disabled>${T('Cargando tus proyectos…', 'Loading your projects…')}</option>`}`;
  };

  // billable / travel / Reisezeit / Einsatzort / don't book: folded away unless this entry uses them
  const moreBits = [l.chargeable === false && T('no facturable', 'non-billable'), l.activity === 'travel' && T('viaje', 'travel'), l.place, l.skip && T('no se reserva', 'not booked')].filter(Boolean);
  const moreOpen = moreBits.length > 0 || TRIP.test(l.description || '');
  const moreSummary = moreBits.length ? ` · ${esc(moreBits.join(' · '))}` : T(' · facturable, viaje, Einsatzort', ' · billable, travel, Einsatzort');
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${adding ? T('Nueva entrada', 'New entry') : T('Editar reunión', 'Edit meeting')}">
    <div class="grab"></div>
    <div class="sheet-body">
      <h3>${adding ? T('Nueva entrada', 'New entry') : esc(l.description) || T('Entrada', 'Entry')}</h3>
      <div class="sub">${manual ? (adding ? T(`Se suma a ${dayLabel(date).toLowerCase()}`, `Added to ${dayLabel(date)}`) + (d && d.status !== 'pending' ? T(' · además de lo que ya está en CPM', ' · on top of what is already in CPM') : '') : T('Entrada agregada a mano', 'Entry added by hand'))
        : `${l.start}–${l.end} · ${num(duration(l))} h ${T('en el calendario', 'in the calendar')}${l.plannedEnd ? ` · ⏱ ${T(`real time (planeada hasta ${l.plannedEnd})`, `real time (planned until ${l.plannedEnd})`)}` : ''}`}</div>
      ${manual ? `<label for="desc">${T('Comentario', 'Comment')}</label>
        <textarea id="desc" rows="2" placeholder="${T('Qué hiciste, p. ej. “Scanner logic master pack”', 'What you did, e.g. “Scanner logic master pack”')}"></textarea>` : ''}
      <label>${T('Según tu historial', 'From your history')}</label>
      <div class="chips" id="hints"></div>
      <label for="proj">${T('Proyecto', 'Project')}</label>
      <select id="proj">${projectOptions()}</select>
      <label for="q">Ticket <span class="picked" id="picked"></span></label>
      <div class="picked-full" id="pickedFull"></div>
      <div class="search"><input type="search" id="q" placeholder="${T('Filtrar por número o palabra', 'Filter by number or word')}" autocomplete="off" enterkeyhint="search"></div>
      <div class="tickets" id="tickets"></div>
      <label for="hrs">${T('Horas a reservar', 'Hours to book')}</label>
      <div class="hrs"><button class="step" data-step="-0.25" aria-label="${T('Menos', 'Less')}">−</button>
        <input type="number" id="hrs" min="0" max="24" step="0.25" inputmode="decimal">
        <button class="step" data-step="0.25" aria-label="${T('Más', 'More')}">+</button>
        ${manual ? '' : `<button class="btn quiet" id="reset">${T('Duración', 'Duration')}</button>`}</div>
      <details class="more"${moreOpen ? ' open' : ''}><summary>${T('Más opciones', 'More options')}<span>${moreSummary}</span></summary>
      <div class="switches">
        <label class="switch">${T('Facturable', 'Billable')}<input type="checkbox" id="charge"></label>
        <label class="switch">🚆 ${T('Tiempo de viaje', 'Travel time')}<input type="checkbox" id="travel"></label>
        <p class="hint trav-note" id="travNote"></p>
        <label class="switch field" id="travRow">${T('Reisezeit (horas reales de viaje)', 'Reisezeit (real travel hours)')}<input type="number" id="travH" min="0" max="24" step="0.25" inputmode="decimal"></label>
        <label class="switch field">Einsatzort<input type="text" id="place" placeholder="concircle office" autocomplete="off"></label>
        ${adding ? '' : `<label class="switch">${T('No reservar esta entrada', "Don't book this entry")}<input type="checkbox" id="skipLine"></label>`}
      </div>
      </details>
    </div>
    <div class="sheet-foot"><button class="btn quiet" id="cancel">${T('Cancelar', 'Cancel')}</button><button class="btn primary" id="ok">${adding ? T('Agregar', 'Add') : T('Guardar', 'Save')}</button></div>
  </div>`;
  document.body.appendChild(bg);
  const $$ = (s) => bg.querySelector(s);
  const q = $$('#q'), list = $$('#tickets'), proj = $$('#proj'), hintsEl = $$('#hints'), picked = $$('#picked'), pickedFull = $$('#pickedFull');
  const hrs = $$('#hrs'), charge = $$('#charge'), skipLine = $$('#skipLine'), desc = $$('#desc');
  hrs.value = draft.hours ?? round2(duration(l));
  charge.checked = draft.chargeable;
  if (skipLine) skipLine.checked = !!l.skip;
  const travelBox = $$('#travel');
  travelBox.checked = l.activity === 'travel';
  const travNote = $$('#travNote'), travRow = $$('#travRow'), travH = $$('#travH'), placeIn = $$('#place');
  travH.value = l.travelHours ?? (l.start && l.end ? round2(duration(l)) : '');
  placeIn.value = l.place || '';
  // which CPM activity a travel line becomes depends on the project
  // Red Bull travel, per the email: the rule depends on where the trip goes
  const rbTravelNote = () => {
    const text = `${l.description || ''} ${desc?.value || ''} ${placeIn.value || ''}`;
    const real = l.start && l.end ? duration(l) : null;
    const dest = /ludesch/i.test(text) ? 'ludesch' : /elsbethen|salzburg|fuschl/i.test(text) ? 'elsbethen' : '';
    const sug = dest === 'elsbethen' ? 1 : dest === 'ludesch' && real ? Math.round(real * 0.5 * 4) / 4 : null;
    const use = sug != null && Number(hrs.value) !== sug ? ` <a href="#" data-usehrs="${sug}">${T(`usar ${num(sug)} h`, `use ${num(sug)} h`)}</a>` : '';
    const head = T('Red Bull (según el email): se reserva como <b>Travel Time (Red Bull)</b>.', 'Red Bull (per the email): booked as <b>Travel Time (Red Bull)</b>.');
    if (dest === 'elsbethen') return `${head} ${T('Elsbethen: <b>1 h por trayecto</b>, dure lo que dure.', 'Elsbethen: <b>1 h per trip</b>, however long it took.')}${use}`;
    if (dest === 'ludesch') return `${head} ${T('Ludesch: <b>50 %</b> del viaje que no trabajaste', 'Ludesch: <b>50 %</b> of the trip you did not work')}${real ? ` (${num(real)} h → ${num(sug)} h)` : ''}. ${T('Si trabajaste en el tren, réstalo antes.', 'If you worked on the train, take that off first.')}${use}`;
    return `${head} ${T('Elsbethen: 1 h por trayecto · Ludesch: 50 % del viaje no trabajado. Escribe el destino en Einsatzort para que te sugiera las horas.', 'Elsbethen: 1 h per trip · Ludesch: 50 % of the unworked trip. Type the destination in Einsatzort to get a suggestion.')}`;
  };
  travNote.addEventListener('click', (e) => {
    const u = e.target.closest('[data-usehrs]'); if (!u) return;
    e.preventDefault(); hrs.value = u.dataset.usehrs; draft.hours = Number(u.dataset.usehrs); drawTravNote();
  });
  placeIn.addEventListener('input', () => drawTravNote());
  const drawTravNote = () => {
    travNote.hidden = !travelBox.checked; travRow.hidden = !travelBox.checked || !draft.project || isRb(draft.project);
    travNote.innerHTML = !draft.project ? T('Elige un ticket para saber cómo se reserva.', 'Pick a ticket to see how it is booked.')
      : isRb(draft.project) ? rbTravelNote()
      : T('Otros proyectos: se reserva <b>Chargeable con 0 h</b> y las horas reales van en <b>Reisezeit</b>.', 'Other projects: booked as <b>Chargeable with 0 h</b>, the real hours in <b>Reisezeit</b>.');
    // other projects: the booked hours are 0, the travel is in Reisezeit
    if (travelBox.checked && draft.project && !isRb(draft.project) && Number(hrs.value) !== 0) { hrs.value = 0; draft.hours = 0; }
  };
  travelBox.addEventListener('change', drawTravNote);
  if (desc) desc.value = draft.description;
  proj.value = pid ? String(pid) : '';
  const text = () => (desc ? desc.value : l.description) || '';

  function choose(project, ticket, chargeable) {
    draft.project = String(project ?? '').trim(); draft.ticket = ticket;
    const known = catalog.find((x) => x[1] === ticket);
    if (chargeable != null) draft.chargeable = !!chargeable; else if (known) draft.chargeable = !!known[3];
    charge.checked = draft.chargeable;
    const id = projectIdOf(draft.project);
    if (id && String(id) !== proj.value) { pid = id; proj.value = String(id); askTickets(id); }
    q.value = ''; q.blur(); draw();
  }

  /* history suggestions, asked to the approver ("hint <id> <text>") */
  let hintId = '', hintSent = 0, hintTimer;
  function askHint() {
    const t = text().trim();
    if (!t) { hintId = ''; return drawHints(); }
    hintId = Math.random().toString(36).slice(2, 10); hintSent = Date.now();
    send(`hint ${hintId} ${t.replace(/\s+/g, ' ').slice(0, 280)}`);
    drawHints(); setTimeout(drawHints, 20000);
  }
  function drawHints() {
    if (!hintId) { hintsEl.innerHTML = `<p class="hint">${T('Escribe un comentario y te sugiero dónde va.', "Type a comment and I'll suggest where it goes.")}</p>`; return; }
    const rows = hints[hintId];
    if (!rows) {
      hintsEl.innerHTML = `<p class="hint">${Date.now() - hintSent > 19000 ? T('Sin respuesta (¿está encendida la Mac o la VM?).', 'No answer (is the Mac or the VM on?).') : T('Buscando en tu historial…', 'Looking through your history…')}</p>`;
      return;
    }
    hintsEl.innerHTML = rows.length
      ? rows.slice(0, 4).map((r) => `<button class="chip" data-hp="${esc(r[0])}" data-ht="${esc(r[1])}" data-hc="${r[3]}" aria-pressed="${r[1] === draft.ticket}">
          <b>${esc(r[2] || r[1])}</b><small>${esc(pname(r[0]))}</small></button>`).join('')
      : `<p class="hint">${T('Nada parecido en tu historial.', 'Nothing similar in your history.')}</p>`;
  }
  hintsEl.addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    choose(c.dataset.hp, c.dataset.ht, c.dataset.hc === '1');
  });

  /* the ticket list: the chosen project's open tickets (with budget), or your recent ones */
  const SEARCHING = T('Buscando en CPM…', 'Searching CPM…');
  let remote = [], remoteState = '', searchCtl, timer;
  const row = (r, extra = '') => `<button class="ticket" data-t="${esc(r[1])}" data-p="${esc(r[0])}" aria-pressed="${r[1] === draft.ticket}">
      <b>${esc(r[2] || r[1])}</b>${extra}<small>${esc(pname(r[0]))}</small></button>`;
  const prow = (r) => `<button class="ticket" data-t="${esc(r[0])}" data-p="${esc(projectName(pid))}" aria-pressed="${r[0] === draft.ticket}">
      <span class="pname">${esc(r[1])}</span><span class="trow">${r[4] ? `<span class="mine">${T('tuyo', 'yours')}</span>` : ''}${budgetTag(r, Number(hrs.value) || 0)}</span></button>`;

  function drawPicked() {
    if (!draft.ticket) { picked.innerHTML = `<span class="none">${T('sin elegir', 'none chosen')}</span>`; pickedFull.textContent = ''; return; }
    const pr = (ticketsByProject[projectIdOf(draft.project)]?.rows ?? []).find((r) => r[0] === draft.ticket);
    const c = catalog.find((r) => r[1] === draft.ticket);
    picked.innerHTML = '';
    pickedFull.textContent = pr?.[1] ?? c?.[2] ?? '';
  }

  let shownProjects = projects.length;
  function draw() {
    drawTravNote?.();
    if (shownProjects !== projects.length) {
      shownProjects = projects.length;
      proj.innerHTML = projectOptions();
      if (!pid) pid = projectIdOf(draft.project);
      proj.value = pid ? String(pid) : '';
      if (pid) askTickets(pid);
    }
    drawPicked(); drawHints();
    const qt = q.value.trim(), qw = qt.toLowerCase().replace(/#/g, '').split(/\s+/).filter(Boolean);
    let html = '';
    if (pid) {
      const t = ticketsByProject[pid];
      if (!t) { list.innerHTML = `<p class="hint">${T('Cargando los tickets del proyecto…', "Loading the project's tickets…")}</p>`; return; }
      let rows = t.rows;
      if (qw.length) {
        rows = rows.filter((r) => qw.every((w) => `${r[0]} ${r[1]}`.toLowerCase().includes(w)));
        html += rows.length ? rows.map(prow).join('') : `<p class="hint">${T('Ningún ticket abierto coincide.', 'No open ticket matches.')}</p>`;
      } else {
        const mw = words(text());
        const recent = new Set(catalog.map((c) => c[1]));
        const scored = rows.map((r) => {
          const sw = words(r[1]);
          return { r, s: mw.filter((w) => sw.some((x) => x.startsWith(w) || w.startsWith(x))).length };
        });
        const similar = scored.filter((x) => x.s > 0).sort((a, b) => b.s - a.s || b.r[4] - a.r[4]).slice(0, 5).map((x) => x.r);
        const cur = rows.find((r) => r[0] === draft.ticket);
        const top = [...new Set([cur, ...similar].filter(Boolean))];
        const rest = rows.filter((r) => !top.includes(r))
          .sort((a, b) => b[4] - a[4] || (recent.has(b[0]) - recent.has(a[0])) || Number(b[0].slice(1)) - Number(a[0].slice(1)));
        if (top.length) html += `<div class="group">${similar.length ? T('Parecidos a esta entrada', 'Similar to this entry') : T('Elegido', 'Chosen')}</div>` + top.map(prow).join('');
        html += `<div class="group">${T(`Abiertos en el proyecto (${rest.length})`, `Open in the project (${rest.length})`)}</div>` + rest.map(prow).join('');
      }
      list.innerHTML = html + `<p class="hint">${T('Actualizado', 'Updated')} ${new Date(t.fetched).toLocaleTimeString(lang === 'en' ? 'en' : 'es', { hour: '2-digit', minute: '2-digit' })} · <a href="#" data-reload>${T('recargar', 'reload')}</a></p>`;
      return;
    }
    // no project: your recent tickets, plus a CPM search when the Copilot is reachable
    const current = catalog.find((r) => r[1] === draft.ticket) ?? (draft.ticket ? [draft.project, draft.ticket, '', draft.chargeable ? 1 : 0] : null);
    const options = current ? [current, ...catalog.filter((r) => r !== current)] : [...catalog];
    const local = options.filter((r) => qw.every((w) => r.join(' ').toLowerCase().includes(w)));
    const shown = new Set(local.map((r) => r[1]));
    const more = remote.filter((r) => !shown.has(r[1]));
    const digits = qt.replace(/^#/, '');
    if (local.length) html += `<div class="group">${qt ? T('Tus tickets', 'Your tickets') : T('Recientes', 'Recent')}</div>` + local.map((r) => row(r)).join('');
    if (more.length) html += `<div class="group">${T('En CPM', 'In CPM')}</div>` + more.map((r) => row(r)).join('');
    if (/^\d{3,7}$/.test(digits) && !shown.has('#' + digits) && !more.some((r) => r[1] === '#' + digits) && remoteState !== SEARCHING) {
      html += `<button class="ticket" data-t="#${digits}" data-p=""><b>${T('Usar', 'Use')} #${digits}</b><small>${T('No está en la lista, pero puedes usarlo igual', 'Not in the list, but you can still use it')}</small></button>`;
    }
    if (remoteState) html += `<p class="hint">${remoteState}</p>`;
    html += `<p class="hint">${T('Elige un proyecto arriba para ver todos sus tickets y el budget que les queda.', 'Pick a project above to see all its tickets and their budget left.')}</p>`;
    list.innerHTML = html;
  }
  async function searchCpm() {
    if (pid) return draw();
    const qt = q.value.trim(), digits = qt.replace(/^#/, '');
    searchCtl?.abort(); remote = [];
    if (!(/^\d{3,7}$/.test(digits) || qt.length >= 3) || !copilot || !searchKey) { remoteState = ''; return draw(); }
    const ctl = searchCtl = new AbortController();
    const timeout = setTimeout(() => ctl.abort(), 15000);
    remoteState = SEARCHING; draw();
    try {
      const r = await fetch(`${copilot}/issues?q=${encodeURIComponent(qt)}`, { headers: { 'x-copilot-key': searchKey }, signal: ctl.signal });
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || r.status);
      remote = body.issues.map((i) => [i.project, '#' + i.id, i.subject, null]);
      remoteState = remote.length ? '' : T('Nada más en CPM.', 'Nothing else in CPM.');
    } catch {
      if (ctl !== searchCtl) return;
      remoteState = '';
    } finally { clearTimeout(timeout); }
    if (ctl === searchCtl) draw();
  }

  editorHook = draw;
  if (pid) askTickets(pid);
  if (text().trim()) askHint(); else drawHints();
  draw();
  if (adding) setTimeout(() => desc?.focus(), 250);

  proj.addEventListener('change', () => { pid = proj.value ? Number(proj.value) : ''; q.value = ''; if (pid) askTickets(pid); draw(); });
  q.addEventListener('input', () => { draw(); clearTimeout(timer); timer = setTimeout(searchCpm, 300); });
  desc?.addEventListener('input', () => { draft.description = desc.value; clearTimeout(hintTimer); hintTimer = setTimeout(() => { askHint(); draw(); }, 700); });
  list.addEventListener('click', (e) => {
    if (e.target.closest('[data-reload]')) { e.preventDefault(); askTickets(pid, true); list.insertAdjacentHTML('beforeend', `<p class="hint">${T('Recargando…', 'Reloading…')}</p>`); return; }
    const t = e.target.closest('.ticket'); if (!t) return;
    const r = remote.find((x) => x[1] === t.dataset.t);
    choose(t.dataset.p || r?.[0] || draft.project, t.dataset.t);
  });
  bg.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => {
    const v = Math.min(24, Math.max(0, round2((Number(hrs.value) || 0) + Number(b.dataset.step))));
    hrs.value = v; draft.hours = v; if (pid) draw();
  });
  $$('#reset')?.addEventListener('click', () => { hrs.value = round2(duration(l)); draft.hours = null; });
  hrs.addEventListener('input', () => { draft.hours = hrs.value === '' ? null : Number(hrs.value); });
  const close = () => { editorHook = null; bg.remove(); };
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  $$('#cancel').onclick = close;
  $$('#ok').onclick = () => {
    if (adding) {
      const h = Number(hrs.value);
      if (!draft.ticket) return toast(T('Elige un ticket.', 'Pick a ticket.'));
      const th = travelBox.checked && !isRb(draft.project) ? Number(travH.value) || 0 : 0;
      if (!(h >= 0 && h <= 24) || (h === 0 && !(th > 0))) return toast(T('Horas entre 0 y 24 (o 0 con Reisezeit).', 'Hours between 0 and 24 (or 0 with Reisezeit).'));
      close();
      return addLine(date, { description: (desc?.value || '').trim(), project: draft.project, ticket: draft.ticket, chargeable: charge.checked, hours: round2(h),
        ...(travelBox.checked ? { activity: 'travel', ...(th > 0 ? { travelHours: round2(th) } : {}) } : {}), ...(placeIn.value.trim() ? { place: placeIn.value.trim() } : {}) });
    }
    const change = { i };
    if (draft.ticket !== (l.ticket || '') || draft.project !== (l.project || '').trim()) { change.ticket = draft.ticket; change.project = draft.project; }
    if (charge.checked !== (l.chargeable !== false)) change.chargeable = charge.checked;
    if (manual) {
      if (draft.hours != null && draft.hours !== l.hours) change.hours = draft.hours;
      if (desc && desc.value.trim() !== (l.description || '')) change.description = desc.value.trim();
    } else {
      const h = draft.hours === null || Math.abs(draft.hours - duration(l)) < 0.001 ? null : draft.hours;
      if (h !== (typeof l.hours === 'number' ? l.hours : null)) change.hours = h;
    }
    if (skipLine && skipLine.checked !== !!l.skip) change.skip = skipLine.checked;
    if (travelBox.checked !== (l.activity === 'travel')) change.activity = travelBox.checked ? 'travel' : null;
    const th = travelBox.checked && !isRb(draft.project) ? Number(travH.value) || null : null;
    if (th !== (l.travelHours ?? null)) change.travelHours = th;
    if (placeIn.value.trim() !== (l.place || '')) change.place = placeIn.value.trim() || null;
    if (change.hours != null && !(change.hours >= 0 && change.hours <= 24)) return toast(T('Horas entre 0 y 24.', 'Hours between 0 and 24.'));
    close();
    if (Object.keys(change).length === 1) return;
    applyChange(date, change);
  };
}

// A new entry typed in the app. On a day under review it shows at once; on a day with
// no open draft (no meetings, or already in CPM) the VM starts a top-up for it.
function addLine(date, a) {
  const d = days[date];
  const token = d?.status === 'pending' ? d.token : '-';
  if (d?.status === 'pending') {
    d.lines.push({ start: '', end: '', manual: true, tentative: false, ...a });
    d.entries = toEntries(d.lines);
    store.set('days', JSON.stringify(days));
  }
  saving[date] = true;
  render();
  send(`add ${date} ${token} ${JSON.stringify(a)}`, T('Agregando…', 'Adding…'));
}

// Shows a change at once and sends it to the VM, whose republished draft replaces
// this within seconds. Re-reads the day: a snapshot may have replaced it meanwhile.
function applyChange(date, change) { applyChanges(date, [change]); }
function applyChanges(date, changes) {
  const day = days[date]; if (!day) return;
  for (const change of changes) {
  const cur = day.lines[change.i]; if (!cur) continue;
  if (change.ticket !== undefined) Object.assign(cur, { ticket: change.ticket, project: change.project, tentative: false });
  if (change.chargeable !== undefined) cur.chargeable = change.chargeable;
  if (change.hours !== undefined) { if (change.hours === null) delete cur.hours; else cur.hours = change.hours; }
  if (change.skip !== undefined) cur.skip = change.skip;
  if (change.description !== undefined) cur.description = change.description;
  if (change.activity !== undefined) { if (change.activity) cur.activity = change.activity; else delete cur.activity; }
  if (change.travelHours !== undefined) { if (change.travelHours) cur.travelHours = change.travelHours; else delete cur.travelHours; }
  if (change.place !== undefined) { if (change.place) cur.place = change.place; else delete cur.place; }
  }
  day.entries = toEntries(day.lines);
  saving[date] = true;
  store.set('days', JSON.stringify(days));
  render();
  send(`edit ${date} ${day.token} ${JSON.stringify(changes)}`);
}

// A styled yes/no pop-up; resolves true on the confirm button.
function confirmDialog({ title, text, ok, icon = '?', danger = false }) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal${danger ? ' danger' : ''}" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="icon">${icon}</div><h3>${esc(title)}</h3><p>${text}</p>
      <div class="row"><button class="btn quiet" data-no>${T('Cancelar', 'Cancel')}</button><button class="btn primary" data-yes>${esc(ok)}</button></div></div>`;
    const done = (v) => { bg.remove(); resolve(v); };
    bg.addEventListener('click', (e) => {
      if (e.target === bg || e.target.closest('[data-no]')) done(false);
      else if (e.target.closest('[data-yes]')) done(true);
    });
    document.body.appendChild(bg);
    bg.querySelector('[data-yes]').focus();
  });
}

/* ---------- interaction ---------- */

// "Book N": the selected days one after another, after one confirmation
async function bookWeek(list) {
  const ok = list.filter((k) => days[k]?.status === 'pending' && days[k].entries.length);
  if (!ok.length) return;
  const total = ok.reduce((s, k) => s + totalOf(days[k]), 0);
  const yes = await confirmDialog({
    title: T(`¿Reservar ${ok.length} día${ok.length === 1 ? '' : 's'} en CPM?`, `Book ${ok.length} day${ok.length === 1 ? '' : 's'} in CPM?`), icon: '✓',
    ok: `${T('Reservar', 'Book')} ${num(total)} h`,
    text: ok.map((k) => `<b>${dayLabel(k)}</b>: ${num(totalOf(days[k]))} h`).join('<br>')
      + `<br><br><span style="font-size:13px">${T('Revisa antes los días con reuniones solapadas.', 'Check days with overlapping meetings first.')}</span>`,
  });
  if (!yes) return;
  for (const k of ok) { pending[k] = 'approve'; }
  render();
  for (const k of ok) { await send(`approve ${k} ${days[k].token}`); await new Promise((r) => setTimeout(r, 800)); }
  toast(T('Reservando en CPM…', 'Booking in CPM…'));
}

async function act(b) {
  const date = b.dataset.approve || b.dataset.skip || b.dataset.reopen;
  const d = days[date]; if (!d) return;
  if (b.dataset.reopen) { pending[date] = 'reopen'; render(); return send(`reopen ${date} ${d.token}`, T('Reabriendo…', 'Reopening…')); }
  if (b.dataset.approve) {
    const yes = await confirmDialog({
      title: T('¿Reservar en CPM?', 'Book in CPM?'), icon: '✓', ok: `${T('Reservar', 'Book')} ${num(totalOf(d))} h`,
      text: `<b>${dayLabel(date)}</b><br>${T(`${d.entries.length} entrada${d.entries.length === 1 ? '' : 's'}`, `${d.entries.length} entr${d.entries.length === 1 ? 'y' : 'ies'}`)}: <br>${d.entries.map((e) => `<span class="cf-row">${esc(tname(e.ticket, e.subject).slice(0, 70))}<span>${num(e.hours)} h</span></span>`).join('')}`,
    });
    if (!yes) return;
    pending[date] = 'approve'; render();
    return send(`approve ${date} ${d.token}`, T('Reservando en CPM…', 'Booking in CPM…'));
  }
  pending[date] = 'skip'; render();
  send(`skip ${date} ${d.token}`, T('Saltado. Puedes reabrirlo cuando quieras.', 'Skipped. You can reopen it any time.'));
}

$('#main').addEventListener('click', async (e) => {
  const rm = e.target.closest('[data-remove], [data-restore]');
  if (rm) {
    const [date, i] = (rm.dataset.remove || rm.dataset.restore).split('|');
    const l = days[date]?.lines[Number(i)]; if (!l) return;
    if (rm.dataset.restore) return applyChange(date, { i: Number(i), skip: false });
    const yes = await confirmDialog({
      title: T('¿Quitar esta reunión?', 'Remove this meeting?'), icon: '✕', danger: true, ok: T('Quitar', 'Remove'),
      text: `<b>${esc(l.description)}</b><br>${l.manual ? T('Entrada a mano', 'Manual entry') : `${l.start}–${l.end}`}${l.ticket ? ` · ${num(hours(l))} h` : ''}<br><br>${T('No se reservará en CPM. La puedes volver a incluir con ↺.', "It won't be booked in CPM. You can include it again with ↺.")}`,
    });
    if (yes) applyChange(date, { i: Number(i), skip: true });
    return;
  }
  const retry = e.target.closest('[data-retry]');
  if (retry) {
    const k = retry.dataset.retry;
    waitSince[k] = Date.now(); if (requested[k]) requested[k] = Date.now();
    send(lastCmd[k] ?? `draft ${k}`, T('Reenviado a la VM…', 'Sent to the VM again…'));
    return render();
  }
  const giveup = e.target.closest('[data-giveup]');
  if (giveup) {
    const k = giveup.dataset.giveup;
    delete saving[k]; delete pending[k]; delete waitSince[k]; delete requested[k];
    return render();
  }
  const week = e.target.closest('[data-bookweek]');
  if (week) return bookWeek(week.dataset.bookweek.split(','));
  const jump = e.target.closest('.week [data-day]');
  if (jump) return pick(jump.dataset.day);
  const trip = e.target.closest('[data-trip]');
  if (trip) {
    const [date, i, h, ticket, project, real, place] = trip.dataset.trip.split('|');
    const d = days[date]; if (!d) return;
    // the trip itself, plus Einsatzort on the day's Red Bull work (you were onsite)
    const changes = [{ i: Number(i), ticket, project, hours: Number(h), activity: 'travel', travelHours: null, place }];
    d.lines.forEach((l, k) => { if (k !== Number(i) && !l.skip && isRb(l.project) && l.place !== place) changes.push({ i: k, place }); });
    return applyChanges(date, changes);
  }
  const add = e.target.closest('[data-add]');
  if (add) return openEditor(add.dataset.add, null);
  const line = e.target.closest('[data-line]');
  if (line) { const [date, i] = line.dataset.line.split('|'); return openEditor(date, Number(i)); }
  const other = e.target.closest('[data-select]');
  if (other) return pick(other.dataset.select);
  const ask = e.target.closest('[data-ask]');
  if (ask) return pick(ask.dataset.ask, { force: true });
  if (e.target.closest('#guideOk')) { store.set('guideSeen', '1'); return render(); }
  if (e.target.closest('#copilot') && copilot) window.open(copilot, '_blank');
});
$('#bar').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled) act(b); });
$('#strip').addEventListener('click', (e) => { const b = e.target.closest('[data-day]'); if (b) pick(b.dataset.day); });
$('#strip').addEventListener('change', (e) => { if (e.target.id === 'date') pick(e.target.value); });
function setLangButton() { $('#lang').textContent = lang === 'en' ? 'ES' : 'EN'; document.documentElement.lang = lang; }
$('#lang').onclick = () => { lang = lang === 'en' ? 'es' : 'en'; store.set('lang', lang); setLangButton(); renderStrip.done = false; render(); };
setLangButton();
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; store.set('tab', tab); window.scrollTo(0, 0); render();
});
$('#main').addEventListener('click', (e) => {
  const m = e.target.closest('[data-wfm]');
  if (m && !m.disabled) { wfMonth = shiftMonth(wfMonth, Number(m.dataset.wfm)); return render(); }
  if (e.target.closest('[data-wfreload]')) loadWf(wfMonth, true);
});
$('#refresh').onclick = () => {
  if (!cfg.r) return;
  if (tab === 'wf') {
    const r = $('#refresh'); r.classList.add('spin'); setTimeout(() => r.classList.remove('spin'), 1500);
    if (!copilot || !searchKey) send('refresh'); // the Copilot link + key come with it
    return loadWf(wfMonth, true);
  }
  const r = $('#refresh'); r.classList.add('spin'); setTimeout(() => r.classList.remove('spin'), 1500);
  send('refresh');
  if (selected) pick(selected, { force: true });
  loadWorkday(selected || Object.keys(days).sort().at(-1) || todayIso(), true);
  load();
};

/* ---------- data from the VM ---------- */

function accept(raw) {
  let m; try { m = JSON.parse(raw); } catch { return false; }
  if (m.v !== 1) return false;
  if (m.kind === 'url' && m.url) {
    copilot = m.url; store.set('copilot', copilot);
    if (m.key) { searchKey = m.key; store.set('searchKey', searchKey); }
    setTimeout(pullOutbox, 0);
  }
  if (m.kind === 'week' && Array.isArray(m.rows) && !(store.get('weekAt') > m.at)) {
    for (const k of Object.keys(cpmDays)) if (k >= m.from && k <= m.to) delete cpmDays[k];
    for (const [k, h] of m.rows) cpmDays[k] = h;
    const keep = Object.keys(cpmDays).sort().slice(-40);
    cpmDays = Object.fromEntries(keep.map((k) => [k, cpmDays[k]]));
    store.set('cpmDays', JSON.stringify(cpmDays)); store.set('weekAt', m.at);
  }
  if (['catalog', 'projects', 'tickets', 'hint'].includes(m.kind) && Array.isArray(m.rows)) {
    const key = `${m.kind}|${m.project ?? m.id ?? ''}|${m.at}`;
    const p = (parts[key] ??= { of: m.of || 1, got: new Map() });
    p.got.set(m.part || 0, m.rows);
    if (p.got.size < p.of) return false;
    delete parts[key];
    const rows = [...p.got.keys()].sort((a, b) => a - b).flatMap((k) => p.got.get(k));
    if (m.kind === 'projects' && (!store.get('projectsAt') || m.at >= store.get('projectsAt'))) {
      projects = rows; store.set('projects', JSON.stringify(rows)); store.set('projectsAt', m.at);
    }
    if (m.kind === 'tickets' && m.project && !(ticketsByProject[m.project]?.at > m.at)) {
      ticketsByProject[m.project] = { rows, at: m.at, fetched: Date.parse(m.at) || Date.now() };
      const keep = Object.entries(ticketsByProject).sort((a, b) => b[1].fetched - a[1].fetched).slice(0, 8);
      ticketsByProject = Object.fromEntries(keep);
      store.set('tickets', JSON.stringify(ticketsByProject));
    }
    if (m.kind === 'hint' && m.id) hints[m.id] = rows;
    if (m.kind === 'catalog' && (!store.get('catalogAt') || m.at >= store.get('catalogAt'))) {
      catalog = rows; store.set('catalog', JSON.stringify(rows)); store.set('catalogAt', m.at);
    }
    editorHook?.();
    return false;
  }
  if (m.kind === 'day' && m.date) {
    const prev = days[m.date];
    // only a newer snapshot counts: replays of an older one would undo an unconfirmed edit
    if (prev && m.at <= prev.at) return false;
    if (saving[m.date] || pending[m.date]) toast(m.status === 'booked' ? T('✅ Reservado en CPM', '✅ Booked in CPM') : m.status === 'partial' ? T('⚠️ Algunas entradas fallaron', '⚠️ Some entries failed') : T('Listo', 'Done'));
    delete saving[m.date]; delete requested[m.date]; delete waitSince[m.date];
    days[m.date] = m;
    if (m.status !== 'pending' || pending[m.date] === 'reopen') delete pending[m.date];
    const keep = Object.keys(days).sort().slice(-30);
    days = Object.fromEntries(keep.map((k) => [k, days[k]]));
    store.set('days', JSON.stringify(days));
  }
  if (!lastAt || m.at > lastAt) { lastAt = m.at; store.set('lastAt', lastAt); }
  return true;
}

/* The VM's answers come through the Copilot's tunnel (GET /approver/outbox), not ntfy:
   ntfy.sh caps messages per day, and a busy day of edits once used them all up. ntfy
   still carries the commands, the tunnel link and day status changes (the fallback). */
let pulling = false;
async function pullOutbox() {
  if (!copilot || !searchKey || pulling) return;
  pulling = true;
  try {
    const r = await fetch(`${copilot}/approver/outbox?after=${outSeq}`, { headers: { 'x-copilot-key': searchKey }, signal: AbortSignal.timeout(15000) });
    if (r.ok) {
      const body = await r.json();
      if (body.last < outSeq) outSeq = 0;
      let changed = false;
      for (const m of body.messages ?? []) { changed = accept(JSON.stringify(m)) || changed; if (m.seq > outSeq) outSeq = m.seq; }
      store.set('outSeq', String(outSeq));
      if (changed) render();
    }
  } catch {} finally { pulling = false; }
}
// quick while the app waits for an answer (or the editor is open), slow otherwise
(function outboxLoop() {
  const busy = Object.keys(waitSince).length || Object.keys(requested).length || editorHook;
  if (!document.hidden) pullOutbox();
  setTimeout(outboxLoop, busy ? 2500 : 20000);
})();

let loading;
async function load() {
  if (!cfg.d) return render();
  if (loading) return loading;
  loading = (async () => {
    try {
      const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=all`);
      const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
      let changed = false;
      for (const m of msgs) changed = accept(m.message) || changed; // draw once, not per message
      if (changed) render(); else setStatus();
    } catch {}
    loading = null;
  })();
  return loading;
}

let es;
function live() {
  if (!cfg.d || es) return;
  es = new EventSource(`${NTFY}/${cfg.d}/sse`);
  es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message' && accept(m.message)) render(); } catch {} };
  es.onerror = () => { es.close(); es = null; setTimeout(live, 5000); };
}

render(); load(); live();
if (cfg.r && Date.now() - (Date.parse(store.get('weekAt') || '') || 0) > 30 * 60e3) send('week');
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); live(); pullOutbox(); } });
setInterval(setStatus, 30000);
setInterval(() => { if (Object.keys(waitSince).length || Object.keys(requested).length) render(); }, 10000);
</script>
