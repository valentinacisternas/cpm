<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPM">
<meta name="theme-color" content="#0d1420">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CPM</title>
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --ink: #121a26; --muted: #6b7686; --line: #e3e8ef;
    --red: #d93f3f; --red-soft: #fbe6e6; --green: #1f9d55; --green-soft: #e3f5ea;
    --amber: #b7791f; --amber-soft: #fbf1dc; --accent: #2f6fde; --accent-soft: #e4edfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1420; --card: #161f2e; --ink: #ecf1f8; --muted: #94a0b2; --line: #243044;
      --red: #f06b6b; --red-soft: #3a1a1f; --green: #4cc382; --green-soft: #15301f;
      --amber: #e2b45c; --amber-soft: #33281a; --accent: #6b9cf0; --accent-soft: #1b2a45;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 28px; font-weight: 750; letter-spacing: -.02em; margin: 0; flex: 1; }
  .status { font-size: 12px; color: var(--muted); text-align: right; }
  .status b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .status.live b { background: var(--green); }
  .icon-btn { border: 0; background: var(--card); color: var(--ink); width: 38px; height: 38px; border-radius: 50%;
    font-size: 18px; box-shadow: 0 1px 0 var(--line); }
  main { padding: 0 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 4px 8px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
  .line { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline; }
  .line:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .dot.ok { background: var(--green); } .dot.unsure { background: var(--amber); } .dot.none { background: var(--red); }
  .desc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .target { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target.none { color: var(--red); font-weight: 600; }
  .summary { padding: 12px 14px; display: flex; align-items: baseline; gap: 8px; }
  .summary .big { font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .summary .sub { color: var(--muted); font-size: 14px; }
  .warn { margin: 0 14px 12px; padding: 9px 12px; border-radius: 10px; font-size: 13px; }
  .warn.red { background: var(--red-soft); color: var(--red); }
  .warn.amber { background: var(--amber-soft); color: var(--amber); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .pill.pending { background: var(--accent-soft); color: var(--accent); }
  .pill.done { background: var(--green-soft); color: var(--green); }
  .pill.bad { background: var(--red-soft); color: var(--red); }
  .pill.off { background: var(--line); color: var(--muted); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 10px; }
  .btn { border: 0; border-radius: 12px; padding: 13px 12px; font-weight: 650; font-size: 16px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.quiet { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.wide { grid-column: 1 / 3; }
  .btn[disabled] { opacity: .5; }
  .result { font-size: 13px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .result.bad { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  .older summary { list-style: none; cursor: pointer; }
  .older summary::-webkit-details-marker { display: none; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 9;
    background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px;
    transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }
  .setup { background: var(--card); border-radius: 16px; padding: 18px; border: 1px solid var(--line); margin-top: 12px; }
  .setup input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font-size: 15px; margin: 10px 0; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 4px; }
</style>
</head>
<body>
<header>
  <h1>CPM</h1>
  <div class="status" id="status"><b></b>—</div>
  <button class="icon-btn" id="refresh" aria-label="Actualizar">↻</button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/*
  CPM — a tiny front end for the CPM approver that runs on the VM.
  Same idea as the Red Light app: the phone can't reach the VM, so both talk through
  two private ntfy.sh topics:
    data  (VM → app): {kind:"day"} = a drafted day and its status, {kind:"url"} = the Copilot's current link
    reply (app → VM): "approve <date> <token>", "skip <date> <token>", "refresh"
  The topic names live only in this device's storage (they arrive in the link's #fragment,
  which browsers never send to the server).
*/
const NTFY = 'https://ntfy.sh';
const DIAS_LARGO = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('d') && hash.get('r')) { store.set('d', hash.get('d')); store.set('r', hash.get('r')); history.replaceState(null, '', location.pathname); }
const cfg = { d: store.get('d') || hash.get('d'), r: store.get('r') || hash.get('r') };

// days by date, newest kept; the Copilot link
let days = {}; try { days = JSON.parse(store.get('days')) || {}; } catch {}
let copilot = store.get('copilot') || '';
let lastAt = store.get('lastAt') || '';
const pending = {};
let olderOpen = false;
document.addEventListener('toggle', (e) => { if (e.target.matches?.('details.older')) olderOpen = e.target.open; }, true);

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hours = (l) => Math.max(0, (mins(l.end) - mins(l.start)) / 60);
const fmtH = (h) => `${Math.round(h * 100) / 100} h`;
const dayLabel = (key) => {
  const [y, m, d] = key.split('-').map(Number), date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 864e5);
  const base = `${DIAS_LARGO[date.getDay()]} ${d}.${m}`;
  return diff === 0 ? `Hoy · ${base}` : diff === -1 ? `Ayer · ${base}` : base;
};

const STATUS = {
  pending: ['pending', 'Por revisar'],
  booked: ['done', 'Reservado'],
  partial: ['bad', 'Reservado con errores'],
  skipped: ['off', 'Saltado'],
  blocked: ['off', 'Ya tenía reservas'],
  already: ['done', 'Ya reservado en CPM'],
};

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

async function send(cmd, label) {
  try {
    const r = await fetch(`${NTFY}/${cfg.r}`, { method: 'POST', body: cmd });
    if (!r.ok) throw new Error(r.status);
    toast(label);
  } catch {
    toast('No se pudo enviar. ¿Tienes internet?');
  }
}

function setStatus() {
  const el = $('#status');
  if (!lastAt) { el.className = 'status'; el.innerHTML = '<b></b>esperando datos…'; return; }
  const age = (Date.now() - new Date(lastAt)) / 6e4;
  el.className = 'status' + (age < 20 ? ' live' : '');
  el.innerHTML = `<b></b>${age < 1 ? 'ahora' : age < 60 ? `hace ${Math.round(age)} min` : age < 1440 ? `hace ${Math.round(age / 60)} h` : `hace ${Math.round(age / 1440)} d`}`;
}

function dayHtml(d, open) {
  const [cls, label] = STATUS[d.status] ?? ['off', d.status];
  const total = d.entries.reduce((s, e) => s + e.hours, 0);
  const missing = d.lines.filter((l) => !l.ticket).length;
  const overlaps = d.lines.filter((l, i) => d.lines.some((o, j) => j !== i && mins(o.start) < mins(l.end) && mins(o.end) > mins(l.start))).length;
  const wait = pending[d.date];

  let html = `<h2>${dayLabel(d.date)} <span class="pill ${cls}">${label}</span></h2><div class="panel">`;
  if (d.status === 'already') {
    html += `<div class="summary"><span class="big">${fmtH(total)}</span><span class="sub">ya en CPM, nada que aprobar</span></div>`;
    for (const e of d.entries) html += `<div class="result">${esc(e.project)} ${esc(e.ticket)} · ${fmtH(e.hours)}</div>`;
    return html + '</div>';
  }
  html += `<div class="summary"><span class="big">${fmtH(total)}</span><span class="sub">en ${d.entries.length} entrada${d.entries.length === 1 ? '' : 's'}</span></div>`;
  if (missing) html += `<div class="warn red">${missing} reunión${missing === 1 ? '' : 'es'} sin ticket: no se reserva${missing === 1 ? '' : 'n'}.</div>`;
  if (overlaps) html += `<div class="warn amber">${overlaps} reuniones se solapan: las horas se suman dos veces.</div>`;
  if (open) {
    for (const l of d.lines) {
      const kind = !l.ticket ? 'none' : l.tentative ? 'unsure' : 'ok';
      html += `<div class="line"><span class="dot ${kind}"></span><span class="desc">${esc(l.description)}</span>
        <span class="when">${l.start}–${l.end}</span>
        <span class="target${l.ticket ? '' : ' none'}">${l.ticket ? `${esc(l.project)} · ${esc(l.ticket)} · ${fmtH(hours(l))}` : 'Sin ticket'}</span></div>`;
    }
  }
  for (const r of d.results ?? []) html += `<div class="result${r.ok ? '' : ' bad'}">${r.ok ? '✓' : '✗'} ${esc(r.ticket)} ${fmtH(r.hours)}${r.ok ? '' : ': ' + esc(r.error)}</div>`;
  html += '</div>';

  if (d.status === 'pending' && d.entries.length) {
    html += `<div class="buttons">
      <button class="btn primary" data-approve="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'approve' ? 'Reservando…' : 'Reservar'}</button>
      <button class="btn quiet" data-skip="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'skip' ? 'Saltando…' : 'Saltar'}</button>
    </div>`;
  }
  return html;
}

function render() {
  setStatus();
  const main = $('#main');
  if (!cfg.d || !cfg.r) return renderSetup(main);

  const sorted = Object.values(days).sort((a, b) => b.date.localeCompare(a.date));
  let html = '';
  if (!sorted.length) html += '<p class="empty">Todavía no hay borradores.<br><br>Llegan de lunes a viernes a las 17:30. Pulsa ↻ para pedir el último: la VM responde en menos de un minuto.</p>';
  else {
    html += dayHtml(sorted[0], true);
    html += `<div class="buttons"><button class="btn quiet wide" id="copilot" ${copilot ? '' : 'disabled'}>✏️ Editar en el Copilot</button></div>`;
    if (sorted.length > 1) {
      html += `<details class="older"${olderOpen ? ' open' : ''}><summary><h2>Días anteriores ▾</h2></summary>`;
      for (const d of sorted.slice(1, 10)) html += dayHtml(d, false);
      html += '</details>';
    }
  }
  if (!copilot) html += '<p class="note">El enlace al Copilot llega con ↻.</p>';
  main.innerHTML = html;
}

function renderSetup(main) {
  main.innerHTML = `<div class="setup"><b>Falta conectar la app</b>
    <p class="note">Abre esta página con el enlace que te dio Claude (el que termina en <code>#d=…&amp;r=…</code>), o pégalo aquí:</p>
    <input id="link" placeholder="https://…#d=…&r=…" autocomplete="off">
    <button class="btn primary" id="save">Conectar</button></div>`;
  $('#save').onclick = () => {
    const h = new URLSearchParams(($('#link').value.split('#')[1] || ''));
    if (h.get('d') && h.get('r')) { store.set('d', h.get('d')); store.set('r', h.get('r')); location.reload(); }
    else toast('Ese enlace no tiene los datos de conexión.');
  };
}

$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'copilot' && copilot) return window.open(copilot, '_blank');
  const date = b.dataset.approve || b.dataset.skip; if (!date) return;
  const d = days[date]; if (!d) return;
  if (b.dataset.approve) {
    if (!confirm(`¿Reservar ${fmtH(d.entries.reduce((s, x) => s + x.hours, 0))} en CPM para el ${dayLabel(date)}?`)) return;
    pending[date] = 'approve'; render();
    return send(`approve ${date} ${d.token}`, 'Reservando… la confirmación llega en menos de un minuto');
  }
  pending[date] = 'skip'; render();
  send(`skip ${date} ${d.token}`, 'Saltado. Puedes reservarlo luego en el Copilot.');
});

$('#refresh').onclick = () => { if (cfg.r) send('refresh', 'Pidiendo datos a la VM…'); load(); };

function accept(raw) {
  let m; try { m = JSON.parse(raw); } catch { return; }
  if (m.v !== 1) return;
  if (m.kind === 'url' && m.url) { copilot = m.url; store.set('copilot', copilot); }
  if (m.kind === 'day' && m.date) {
    const prev = days[m.date];
    if (prev && prev.at > m.at) return;
    days[m.date] = m;
    if (m.status !== 'pending') delete pending[m.date];
    const keep = Object.keys(days).sort().slice(-30);
    days = Object.fromEntries(keep.map((k) => [k, days[k]]));
    store.set('days', JSON.stringify(days));
  }
  if (!lastAt || m.at > lastAt) { lastAt = m.at; store.set('lastAt', lastAt); }
  render();
}

async function load() {
  if (!cfg.d) return render();
  try {
    const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=all`);
    const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
    for (const m of msgs) accept(m.message);
  } catch {}
  render();
}

let es;
function live() {
  if (!cfg.d || es) return;
  es = new EventSource(`${NTFY}/${cfg.d}/sse`);
  es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') accept(m.message); } catch {} };
  es.onerror = () => { es.close(); es = null; setTimeout(live, 5000); };
}

render(); load(); live();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); live(); } });
setInterval(setStatus, 30000);
</script>
</body>
</html>
