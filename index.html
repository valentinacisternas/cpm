<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPM">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111c" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CPM</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #ffffff; --card-2: #f7f8fb; --ink: #0f1726; --ink-2: #3a4556; --muted: #7a8596; --line: #e6e9f0;
    --accent: #2f6fde; --accent-2: #1e40aa; --accent-soft: #e6eefc;
    --green: #17985a; --green-soft: #e2f4ea; --amber: #b7741a; --amber-soft: #fbf0dc; --red: #d23f3f; --red-soft: #fbe5e5;
    --shadow: 0 1px 2px #0f17260a, 0 4px 14px #0f17260d;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b111c; --card: #141c2b; --card-2: #1a2334; --ink: #edf2fa; --ink-2: #c3ccda; --muted: #8a96aa; --line: #232e42;
      --accent: #6d9cf2; --accent-2: #3d6fd6; --accent-soft: #1a2a48;
      --green: #4fc887; --green-soft: #13301f; --amber: #e5b35c; --amber-soft: #33281a; --red: #f07373; --red-soft: #3a1b20;
      --shadow: 0 1px 2px #0006, 0 6px 18px #0004;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; padding: 12px 16px 6px; display: flex; align-items: center; gap: 12px;
    background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .logo { width: 36px; height: 36px; border-radius: 10px; flex: none; box-shadow: var(--shadow); }
  .brand { flex: 1; min-width: 0; }
  header h1 { font-size: 22px; font-weight: 760; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .status b { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.live b { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .round { border: 0; background: var(--card); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; box-shadow: var(--shadow); flex: none; }
  .round.lang { font-size: 13px; font-weight: 750; letter-spacing: .02em; }
  .round.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* day strip */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 16px 12px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .strip::-webkit-scrollbar { display: none; }
  .day { position: relative; flex: none; width: 52px; padding: 8px 0 9px; border: 0; border-radius: 14px; background: var(--card);
    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 1px; scroll-snap-align: end; }
  .day small { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .day span { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 3px; }
  .day i.pending { background: var(--accent); } .day i.done { background: var(--green); } .day i.bad { background: var(--red); } .day i.off { background: var(--muted); opacity: .5; }
  .day[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .day[aria-pressed="true"] small { color: #ffffffc0; }
  .day[aria-pressed="true"] i { background: #fff !important; opacity: 1; }
  .day.cal { width: 52px; justify-content: center; font-size: 20px; }
  .day.cal input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

  main { padding: 0 16px; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* hero */
  .hero { border-radius: 22px; padding: 18px 18px 16px; color: #fff; box-shadow: 0 10px 30px #2f6fde40;
    background: radial-gradient(120% 140% at 100% 0%, #5b8ff0 0%, var(--accent) 45%, var(--accent-2) 100%); }
  .hero.done { background: radial-gradient(120% 140% at 100% 0%, #3ccf86 0%, #17985a 50%, #0f6d40 100%); box-shadow: 0 10px 30px #17985a40; }
  .hero.off { background: linear-gradient(135deg, #6f7b8f, #4b5566); box-shadow: 0 10px 30px #0f172620; }
  .hero.bad { background: linear-gradient(135deg, #e86060, #b52f2f); box-shadow: 0 10px 30px #d23f3f40; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; opacity: .95; }
  .hero-pill { background: #ffffff2e; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap; }
  .hero-total { font-size: 46px; font-weight: 780; letter-spacing: -.03em; line-height: 1; margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .hero-total small { font-size: 20px; font-weight: 650; opacity: .85; margin-left: 2px; }
  .hero-sub { font-size: 14px; opacity: .88; }
  .workday { margin-top: 10px; font-size: 14px; background: #ffffff1f; border-radius: 10px; padding: 7px 10px; }
  .workday.muted { opacity: .8; }
  .workday.warn { background: #ffffff33; font-weight: 600; margin-top: 6px; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .stat { background: #ffffff24; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .stat b { width: 7px; height: 7px; border-radius: 50%; }

  .banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 11px 13px; font-size: 14px; margin-top: 10px; }
  .banner.red { background: var(--red-soft); color: var(--red); }
  .banner.amber { background: var(--amber-soft); color: var(--amber); }
  .banner.blue { background: var(--accent-soft); color: var(--accent); }

  .section { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px 8px; }
  .section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 700; }
  .section span { font-size: 12px; color: var(--muted); }

  /* meetings */
  .list { display: grid; gap: 8px; }
  .mt { position: relative; display: grid; grid-template-columns: 50px 1fr auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left;
    background: var(--card); border: 0; border-radius: 16px; padding: 12px 12px 12px 16px; box-shadow: var(--shadow); overflow: hidden; }
  .mt::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--green); }
  .mt.unsure::before { background: var(--amber); } .mt.none::before { background: var(--red); } .mt.off::before { background: var(--line); }
  .mt:active { transform: scale(.985); }
  .mt .t { grid-column: 1; grid-row: 1 / span 2; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .mt .title { grid-column: 2; grid-row: 1; }
  .mt .tags { grid-column: 2; grid-row: 2; }
  .mt .h { grid-column: 3; }
  .mt .t .real { color: var(--accent); font-weight: 650; }
  .mt .t b { display: block; font-size: 15px; } .mt .t span { font-size: 12.5px; color: var(--muted); }
  .mt .title { font-weight: 640; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt .h { grid-row: 1 / span 2; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; text-align: right; }
  .mt .h.edited { color: var(--accent); }
  .mt .h small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mt .tags { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 12.5px; color: var(--muted); }
  .tag { flex: none; font-weight: 650; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); }
  .tag.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
  .tags .proj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt.off .title, .mt.off .t { opacity: .5; } .mt.off .title { text-decoration: line-through; }
  .mt.static { cursor: default; } .mt.static:active { transform: none; }
  .mt { cursor: pointer; }
  .mt.has-rm { grid-template-columns: 50px 1fr auto 30px; }
  .rm { grid-column: 4; grid-row: 1 / span 2; width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: var(--card-2); color: var(--muted); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .rm:active { background: var(--red-soft); color: var(--red); }
  .rm.undo { color: var(--accent); background: var(--accent-soft); font-size: 16px; }

  /* confirm pop-up */
  .modal-bg { position: fixed; inset: 0; z-index: 40; background: #0b111c80; display: grid; place-items: center; padding: 24px; animation: fade .15s; }
  .modal { background: var(--card); width: min(340px, 100%); border-radius: 20px; padding: 20px 18px 16px; text-align: center; animation: pop .18s ease-out;
    box-shadow: 0 20px 50px #0004; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .modal .icon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; font-size: 20px;
    background: var(--accent-soft); color: var(--accent); }
  .modal.danger .icon { background: var(--red-soft); color: var(--red); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; }
  .modal p b { color: var(--ink); }
  .modal .row { display: flex; gap: 10px; }
  .modal .btn { flex: 1; }
  .modal.danger .btn.primary { background: var(--red); box-shadow: 0 6px 16px #d23f3f40; }

  .rows { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .rows div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .rows div:first-child { border-top: 0; }
  .rows div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .bad { color: var(--red); }
  .rows b { font-variant-numeric: tabular-nums; flex: none; }

  .link { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 18px; padding: 14px 16px; border: 0; border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow); text-align: left; font-weight: 620; }
  .link span { flex: 1; } .link small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .link[disabled] { opacity: .5; }

  .others summary { list-style: none; cursor: pointer; }
  .others summary::-webkit-details-marker { display: none; }
  .others .rows div { cursor: pointer; }

  .empty { text-align: center; color: var(--muted); padding: 44px 24px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .skeleton { height: 150px; border-radius: 22px; background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* bottom action bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--line); transform: translateY(110%); transition: transform .25s ease; }
  .bar.show { transform: none; }
  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 680; font-size: 16px; }
  .btn.primary { flex: 1; background: #2f6fde; color: #fff; box-shadow: 0 6px 16px #2f6fde40; }
  .btn.quiet { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .btn[disabled] { opacity: .5; box-shadow: none; }

  .toast { position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top)); z-index: 30; text-align: center;
    background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 14px; font-size: 14px; font-weight: 550;
    transform: translateY(-20px); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }

  /* editor sheet */
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: #0b111c66; display: flex; align-items: flex-end; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--bg); width: 100%; max-height: 90vh; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } }
  .sheet-body { overflow-y: auto; padding: 8px 16px 12px; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 6px; flex: none; }
  .sheet h3 { margin: 4px 0 2px; font-size: 19px; letter-spacing: -.01em; }
  .sheet .sub { color: var(--muted); font-size: 13.5px; }
  .sheet label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin: 18px 4px 7px; }
  .search { position: relative; }
  .search::before { content: "⌕"; position: absolute; left: 13px; top: 50%; transform: translateY(-52%); font-size: 20px; color: var(--muted); }
  .sheet input[type=search], .sheet input[type=number] { width: 100%; padding: 12px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 16px; font-family: inherit; }
  .sheet input[type=search] { padding-left: 38px; }
  .sheet input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tickets { background: var(--card); border-radius: 14px; max-height: 32vh; overflow-y: auto; margin-top: 8px; box-shadow: var(--shadow); }
  .ticket { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 13px; font-size: 15px; }
  .ticket:first-child { border-top: 0; }
  .ticket b { font-variant-numeric: tabular-nums; }
  .ticket small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .group { margin: 10px 13px 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .hint { margin: 10px 13px; font-size: 13px; color: var(--muted); }
  .hrs { display: flex; gap: 8px; }
  .hrs input { flex: 1; }
  .step { width: 48px; border: 0; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 20px; font-weight: 600; }
  .switches { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); margin-top: 18px; }
  .sheet .switch { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; margin: 0;
    font-size: 15.5px; font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .switch + .switch { border-top: 1px solid var(--line); }
  .switch input { appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: .2s; margin: 0; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: .2s; }
  .switch input:checked { background: var(--green); }
  .switch input:checked::after { transform: translateX(20px); }
  .sheet-foot { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .sheet-foot .btn.quiet { flex: none; }

  .guide { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; font-size: 14.5px; }
  .guide-head { display: flex; justify-content: space-between; align-items: center; }
  .guide-head b { font-size: 16px; }
  .x { border: 0; background: var(--card-2); width: 28px; height: 28px; border-radius: 50%; font-size: 13px; color: var(--muted); }
  .guide ol { margin: 10px 0 8px; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
  .guide p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend b { width: 4px; height: 14px; border-radius: 2px; }
  /* tabs */
  .tabs { display: flex; gap: 4px; margin: 2px 16px 6px; padding: 4px; background: var(--card-2); border-radius: 13px; border: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px 0; font-weight: 650; font-size: 14.5px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  /* WF bookings */
  .month { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 12px; }
  .month b { font-size: 18px; letter-spacing: -.01em; }
  .month .round { width: 36px; height: 36px; font-size: 18px; }
  .hero.wf { background: radial-gradient(120% 140% at 100% 0%, #9b7bf0 0%, #6a4fd6 50%, #4a33a8 100%); box-shadow: 0 10px 30px #6a4fd640; }
  .vs { display: flex; gap: 10px; margin-top: 12px; }
  .vs div { flex: 1; background: #ffffff1f; border-radius: 12px; padding: 10px 12px; }
  .vs small { display: block; font-size: 12px; opacity: .85; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .vs b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .issue { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 11px 13px; font-size: 14.5px; }
  .issue .k { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-bottom: 4px; }
  .k.missing { background: var(--red-soft); color: var(--red); } .k.extra, .k.hours { background: var(--amber-soft); color: var(--amber); }
  .k.date, .k.task { background: var(--accent-soft); color: var(--accent); } .k.comment { background: var(--card-2); color: var(--muted); }
  .daytbl div { display: grid; grid-template-columns: 1fr 64px 64px 22px; gap: 6px; }
  .daytbl b { text-align: right; font-weight: 600; } .daytbl .ok { color: var(--green); } .daytbl .no { color: var(--red); }
  .daytbl .head { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .setup { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .setup input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; margin: 10px 0; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 4px; }

  /* editor: project picker, history chips, budget, add entry */
  .sheet select, .sheet textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 16px; font-family: inherit; }
  .sheet select { appearance: none; -webkit-appearance: none; padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .sheet textarea { resize: vertical; min-height: 54px; }
  .sheet select:focus, .sheet textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .picked { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-2); }
  .picked .none { color: var(--red); }
  .chips { display: grid; gap: 6px; }
  .chip { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 11px; font-size: 14px; box-shadow: var(--shadow);
    line-height: 1.35; overflow-wrap: anywhere; }
  .chip small { display: block; color: var(--muted); font-size: 12px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .chips .hint { margin: 2px 4px; }
  .trow { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .ticket .pname { display: block; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .chip b { font-weight: 600; }
  .bud { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .bud.green { background: var(--green-soft); color: var(--green); } .bud.amber { background: var(--amber-soft); color: var(--amber); } .bud.red { background: var(--red-soft); color: var(--red); }
  .mine { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
  .sheet .ticket small { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; line-height: 1.35; margin-top: 1px; }
  .picked-full { margin: -2px 4px 8px; font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
  .hint a { color: var(--accent); }
  .travel { margin-top: 12px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 14px; border-left: 4px solid #8a5cf6; }
  .travel-head { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .trip { padding: 8px 0; border-top: 1px solid var(--line); }
  .trip:first-of-type { border-top: 0; }
  .trip-name { font-weight: 640; }
  .trip-rule { color: var(--ink-2); margin: 2px 0 6px; line-height: 1.4; }
  .trip-do { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card-2); border-radius: 10px; padding: 7px 9px; }
  .trip-do .ok { color: var(--green); font-weight: 700; white-space: nowrap; }
  .btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; flex: none; }
  .trip-sum { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.45; }
  .trip-src { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .sheet .trav-note { margin: 0; padding: 0 14px 12px; }
  .sheet .switch.field input { appearance: auto; width: 140px; height: auto; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line);
    padding: 8px 10px; font-size: 16px; color: var(--ink); text-align: right; }
  .sheet .switch.field input::after { display: none; }
  .sheet .switch[hidden] { display: none; }
  .tag.trav { background: #efe8fe; color: #6b3fd6; border-color: transparent; }
  @media (prefers-color-scheme: dark) { .tag.trav { background: #2a2145; color: #b9a2f7; } }
  .day em { font-style: normal; font-size: 10.5px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 13px; }
  .day[aria-pressed="true"] em { color: #ffffffd0; }
  .day.missing { box-shadow: inset 0 0 0 1.5px var(--red-soft), var(--shadow); }
  .week { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 11px 14px; margin-bottom: 12px; font-size: 14px; }
  .week-head { font-weight: 700; margin-bottom: 6px; }
  .week-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; flex-wrap: wrap; }
  .week-row.miss { color: var(--red); }
  .week .btn.primary { flex: none; }
  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini { border: 0; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 4px 9px; font-size: 13px; font-weight: 650; }
  .vm-do { display: flex; gap: 8px; margin-top: 8px; }
  .cf-row { display: flex; gap: 6px; text-align: left; font-size: 13.5px; padding: 3px 0; } .cf-row span { margin-left: auto; white-space: nowrap; color: var(--ink); }
  details.more { margin-top: 18px; } details.more > summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 650; color: var(--accent); padding: 4px; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: '▸ '; } details.more[open] > summary::before { content: '▾ '; }
  details.more > summary span { color: var(--muted); font-weight: 500; }
  details.more .switches { margin-top: 8px; }
  .addline { display: block; width: 100%; margin-top: 8px; padding: 13px 16px; border: 1.5px dashed var(--line); border-radius: 16px; background: none;
    color: var(--accent); font-weight: 650; text-align: left; }
  .addline small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <div class="brand"><h1>CPM</h1><div class="status" id="status"><b></b>—</div></div>
  <button class="round lang" id="lang" aria-label="Language">EN</button>
  <button class="round" id="refresh" aria-label="Refresh">↻</button>
</header>
<div class="tabs" id="tabs" role="tablist"><button data-tab="cpm" role="tab">CPM</button><button data-tab="wf" role="tab">WF bookings</button></div>
<nav class="strip" id="strip" aria-label="Days"></nav>
<main id="main"></main>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/*
  CPM — a tiny front end for the CPM approver that runs on the VM.
  Same idea as the Red Light app: the phone can't reach the VM, so both talk through
  two private ntfy.sh topics:
    data  (VM → app): {kind:"day"} a drafted day and its status, {kind:"url"} the Copilot's
                      link (+ the ticket-search key), {kind:"catalog"} your recent tickets
    reply (app → VM): "approve|skip|reopen <date> <token>", "edit <date> <token> [changes]",
                      "add <date> <token|-> {entry}", "draft <date>", "refresh", "projects",
                      "tickets <projectId>", "hint <id> <text>" (best tickets for a text, from your history)
  Ticket search goes straight to the Copilot server on the VM (through its tunnel), which
  holds the CPM key. The topic names live only in this device's storage (they arrive in
  the link's #fragment, which browsers never send to the server).
*/
const NTFY = 'https://ntfy.sh';
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Spanish or English: the ES/EN button, else the phone's language. T(es, en) picks one.
let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
const T = (es, en) => (lang === 'en' ? en : es);
const DAYS_SHORT = { es: ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
const DAYS_LONG = { es: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('d') && hash.get('r')) { store.set('d', hash.get('d')); store.set('r', hash.get('r')); history.replaceState(null, '', location.pathname); }
const cfg = { d: store.get('d') || hash.get('d'), r: store.get('r') || hash.get('r') };

const parse = (k, fallback) => { try { return JSON.parse(store.get(k)) || fallback; } catch { return fallback; } };
let days = parse('days', {});
let catalog = parse('catalog', []);
let copilot = store.get('copilot') || '';
let searchKey = store.get('searchKey') || '';
let lastAt = store.get('lastAt') || '';
let workdays = parse('workdays', {}); // date -> the timesheet's start/end/pause/real for that day
let projects = parse('projects', []);         // [id, name, used this year 1/0], recent first
let ticketsByProject = parse('tickets', {});  // project id -> {rows: [ticket, subject, estimated, spent, mine], fetched}
const ticketAsked = {};                       // project id -> when the app asked for its tickets
const hints = {};                             // hint id -> [[project, ticket, subject, chargeable, score]]
const parts = {};                             // long lists arrive in parts; joined here
let editorHook = null;                        // redraws the open editor when its data arrives
let cpmDays = parse('cpmDays', {});           // date -> hours CPM already has (the week view)
const waitSince = {};                         // date -> when the app started waiting for the VM
const lastCmd = {};                           // date -> the last command sent for it (for Retry)
const VM_PATIENCE = 30000;                    // after this the app says the VM isn't answering
let outSeq = Number(store.get('outSeq')) || 0; // how far the VM's outbox has been read
const pending = {};   // date -> 'approve' | 'skip' | 'reopen' sent, waiting for the VM
const saving = {};    // dates with an edit the VM hasn't confirmed yet; Reservar waits for it
const requested = {}; // date -> when the app asked the VM to draft/show it
let selected = '';    // the day on screen; otherwise the newest draft

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
// an entry added by hand has no start/end: its length is its hours
const duration = (l) => (l.start && l.end ? Math.max(0, (mins(l.end) - mins(l.start)) / 60) : (typeof l.hours === 'number' ? l.hours : 0));
const hours = (l) => (typeof l.hours === 'number' ? l.hours : duration(l));
const round2 = (h) => Math.round(h * 100) / 100;
const num = (h) => T(String(round2(h)).replace('.', ','), String(round2(h)));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayIso = () => iso(new Date());
const toDate = (key) => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
const dayLabel = (key) => {
  const date = toDate(key), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 864e5);
  const base = T(`${DAYS_LONG.es[date.getDay()]} ${date.getDate()}.${date.getMonth() + 1}`,
    `${DAYS_LONG.en[date.getDay()]} ${date.getDate()} ${date.toLocaleString('en', { month: 'short' })}`);
  return diff === 0 ? `${T('Hoy', 'Today')} · ${base}` : diff === -1 ? `${T('Ayer', 'Yesterday')} · ${base}` : base;
};

// same grouping as the VM (cpm-daily.mjs toEntries), so an edit shows its effect at once
function toEntries(lines) {
  const groups = new Map();
  for (const l of lines) {
    const h = hours(l);
    if (l.skip || !l.ticket || (h <= 0 && !(l.travelHours > 0))) continue;
    const key = `${l.project}|${l.ticket}|${l.chargeable}|${l.activity ?? ''}|${l.place ?? ''}`;
    const g = groups.get(key) ?? { project: l.project, ticket: l.ticket, activity: l.activity, hours: 0 };
    g.hours += h; groups.set(key, g);
  }
  return [...groups.values()].map((g) => ({ ...g, hours: round2(g.hours) }));
}
const totalOf = (d) => d.entries.reduce((s, e) => s + e.hours, 0);

const STATUS_ALL = {
  pending: ['pending', 'Por revisar', 'To review'],
  booked: ['done', 'Reservado', 'Booked'],
  partial: ['bad', 'Reservado con errores', 'Booked with errors'],
  skipped: ['off', 'Saltado', 'Skipped'],
  blocked: ['off', 'Ya tenía reservas', 'Already had bookings'],
  already: ['done', 'Ya en CPM', 'Already in CPM'],
  empty: ['off', 'Sin reuniones', 'No meetings'],
};
// status -> [css class, label in the current language]
const STATUS = new Proxy({}, { get: (_, k) => STATUS_ALL[k] && [STATUS_ALL[k][0], T(STATUS_ALL[k][1], STATUS_ALL[k][2])] });

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

async function send(cmd, label) {
  const [verb, date] = cmd.split(' ');
  if (/^(edit|add|approve|skip|reopen|draft)$/.test(verb) && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
    lastCmd[date] = cmd;
    waitSince[date] ??= Date.now();
  }
  try {
    const r = await fetch(`${NTFY}/${cfg.r}`, { method: 'POST', body: cmd });
    if (!r.ok) throw new Error(r.status);
    if (label) toast(label);
  } catch {
    toast(T('No se pudo enviar. ¿Tienes internet?', "Couldn't send. Are you online?"));
  }
  setTimeout(pullOutbox, 1500);
}

function pick(date, { force = false } = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  selected = date;
  // a day already here shows at once; the VM is asked only for new days (or with ↻)
  if (!days[date] || force) { requested[date] = Date.now(); send(`draft ${date}`); }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Start/end of the day from your timesheet Excel, read by the Copilot server on the VM.
const workdayLoading = new Set();
async function loadWorkday(date, force = false) {
  if (!copilot || !searchKey || workdayLoading.has(date)) return;
  const known = workdays[date];
  if (known && !force && Date.now() - known.fetched < 10 * 60e3) return;
  workdayLoading.add(date);
  try {
    const r = await fetch(`${copilot}/workday?date=${date}`, { headers: { 'x-copilot-key': searchKey }, signal: AbortSignal.timeout(15000) });
    if (r.ok) {
      workdays[date] = { ...(await r.json()), fetched: Date.now() };
      const keep = Object.keys(workdays).sort().slice(-40);
      workdays = Object.fromEntries(keep.map((k) => [k, workdays[k]]));
      store.set('workdays', JSON.stringify(workdays));
      if (date === (selected || Object.keys(days).sort().at(-1))) render();
    }
  } catch {} finally { workdayLoading.delete(date); }
}

function workdayHtml(date, total, pendingDay) {
  const w = workdays[date];
  if (!w?.configured) return '';
  if (!w.start) return `<div class="workday muted">🕘 ${T('Timesheet: sin hora de inicio todavía', 'Timesheet: no start time yet')}</div>`;
  const span = `${w.start}–${w.end || '…'}`;
  let html = `<div class="workday">🕘 ${span}${w.pause ? ` · ${T('pausa', 'break')} ${num(w.pause)} h` : ''}${w.real > 0 ? ` · <b>${num(w.real)} h</b> ${T('trabajadas', 'worked')}` : ''}</div>`;
  if (pendingDay && w.real > 0 && Math.abs(total - w.real) > 0.25) {
    html += `<div class="workday warn">${total > w.real ? T('⚠️ Vas a reservar más de lo que trabajaste', "⚠️ You're booking more than you worked") : T('ℹ️ Vas a reservar menos de lo que trabajaste', "ℹ️ You're booking less than you worked")} (${num(total)} h vs ${num(w.real)} h)</div>`;
  }
  return html;
}

function setStatus() {
  const el = $('#status');
  if (!lastAt) { el.className = 'status'; el.innerHTML = `<b></b>${T('esperando datos…', 'waiting for data…')}`; return; }
  const age = (Date.now() - new Date(lastAt)) / 6e4;
  el.className = 'status' + (age < 20 ? ' live' : '');
  const ago = (n, u) => T(`hace ${n} ${u}`, `${n} ${u} ago`);
  el.innerHTML = `<b></b>${age < 1 ? T('al día', 'up to date') : age < 60 ? ago(Math.round(age), 'min') : age < 1440 ? ago(Math.round(age / 60), 'h') : ago(Math.round(age / 1440), 'd')}`;
}

/* ---------- rendering ---------- */

// A day's state across the draft and CPM itself: booked (here or elsewhere), to review,
// nothing at all (a past weekday with no draft and no hours in CPM), or off.
const isWeekday = (k) => { const g = toDate(k).getDay(); return g > 0 && g < 6; };
function dayState(k) {
  const d = days[k], inCpm = cpmDays[k] ?? 0;
  if (d && ['booked', 'partial', 'already'].includes(d.status)) return d.status === 'partial' ? 'bad' : 'done';
  if (inCpm > 0) return 'done';
  if (d?.status === 'pending') return 'pending';
  if (d) return 'off';
  return isWeekday(k) && k < todayIso() ? 'missing' : '';
}
// the last two working weeks, newest on the right
function stripDays(current) {
  const out = [];
  for (let d = new Date(), n = 0; out.length < 10 && n < 20; n++, d.setDate(d.getDate() - 1)) {
    if (d.getDay() === 0 || d.getDay() === 6) { if (iso(d) !== current && !days[iso(d)]) continue; }
    out.unshift(iso(d));
  }
  return out;
}
function renderStrip(current) {
  const out = stripDays(current);
  const strip = $('#strip');
  strip.innerHTML = out.map((k) => {
    const d = toDate(k), state = dayState(k);
    const st = state === 'missing' ? 'bad' : state;
    const h = cpmDays[k] > 0 ? cpmDays[k] : days[k]?.entries?.length ? totalOf(days[k]) : 0;
    return `<button class="day${state === 'missing' ? ' missing' : ''}" data-day="${k}" aria-pressed="${k === current}"><small>${k === todayIso() ? T('Hoy', 'Today') : DAYS_SHORT[lang][d.getDay()]}</small><span>${d.getDate()}</span><em>${h ? `${num(h)}h` : state === 'missing' ? '–' : ''}</em><i class="${st}"></i></button>`;
  }).join('') + `<label class="day cal" aria-label="${T('Otra fecha', 'Other date')}">📅<input type="date" id="date" max="${todayIso()}" value="${current || todayIso()}"></label>`;
  const on = strip.querySelector('[aria-pressed="true"]');
  if (on && !renderStrip.done) { on.scrollIntoView({ inline: 'end', block: 'nearest' }); renderStrip.done = true; }
}

function heroHtml(d) {
  const [cls, label] = STATUS[d.status] ?? ['off', d.status];
  const live = d.lines.filter((l) => !l.skip);
  const sure = live.filter((l) => l.ticket && !l.tentative).length;
  const unsure = live.filter((l) => l.ticket && l.tentative).length;
  const missing = live.filter((l) => !l.ticket).length;
  const total = totalOf(d);
  const ne = d.entries.length, nl = d.lines.length;
  const sub = d.topUp ? T(`se suma a ${num(d.inCpm.reduce((s, e) => s + e.hours, 0))} h ya en CPM`, `on top of ${num(d.inCpm.reduce((s, e) => s + e.hours, 0))} h already in CPM`)
    : d.status === 'already' ? T('ya cargadas en CPM', 'already in CPM')
    : d.status === 'empty' ? T('sin reuniones de trabajo en el calendario', 'no work meetings in the calendar')
    : T(`${ne} entrada${ne === 1 ? '' : 's'} · ${nl} reunion${nl === 1 ? '' : 'es'}`, `${ne} entr${ne === 1 ? 'y' : 'ies'} · ${nl} meeting${nl === 1 ? '' : 's'}`);
  let html = `<section class="hero ${cls === 'pending' ? '' : cls}">
    <div class="hero-top"><span>${dayLabel(d.date)}</span><span class="hero-pill">${label}</span></div>
    <div class="hero-total">${num(total)}<small>h</small></div>
    <div class="hero-sub">${sub}</div>
    ${workdayHtml(d.date, total, d.status === 'pending')}`;
  if (d.lines.length) {
    html += '<div class="stats">';
    if (sure) html += `<span class="stat"><b style="background:#5ee0a0"></b>${T(`${sure} segura${sure === 1 ? '' : 's'}`, `${sure} sure`)}</span>`;
    if (unsure) html += `<span class="stat"><b style="background:#ffd27a"></b>${unsure} ${T('por revisar', 'to check')}</span>`;
    if (missing) html += `<span class="stat"><b style="background:#ff9a9a"></b>${missing} ${T('sin ticket', 'no ticket')}</span>`;
    html += '</div>';
  }
  return html + '</section>';
}

function vmSilentHtml(date) {
  const secs = Math.round((Date.now() - (waitSince[date] ?? requested[date] ?? Date.now())) / 1000);
  return `<div class="banner red vm"><span>📡</span><span><b>${T('La VM no responde', "The VM isn't answering")}</b> (${secs >= 120 ? `${Math.round(secs / 60)} min` : `${secs} s`}). ${T('¿Está encendida y con sesión iniciada? Puedes reintentar o dejar de esperar; si dejas de esperar, tus últimos cambios podrían no estar guardados.', 'Is it on and signed in? You can retry or stop waiting; if you stop waiting, your last changes may not be saved.')}
    <span class="vm-do"><button class="btn quiet sm" data-retry="${date}">${T('Reintentar', 'Retry')}</button><button class="btn quiet sm" data-giveup="${date}">${T('Dejar de esperar', 'Stop waiting')}</button></span></span></div>`;
}

/* ---------- Red Bull travel days ---------- */

// The rules from "Korrektes Buchen der Stunden bei RB" (Michaela Matejková, 17.03.2026):
//   Elsbethen: +1 h per trip, whatever it really took.
//   Ludesch:   50 % of the travel time per trip, of the part you did NOT work on the train.
// In CPM it is the activity "Travel Time (Red Bull)" on the trip's Red Bull ticket; in the
// RB system the whole day (work + travel time) goes in as ONSITE.
const TRIP = /m(ü|u|ue)nchen|munich|ludesch|elsbethen/i;
const isRb = (project) => /red bull|solid premix|^025-/i.test(project || '');
function tripsOf(d) {
  return d.lines.map((l, i) => ({ l, i })).filter(({ l }) => !l.skip && TRIP.test(l.description || '')).map(({ l, i }) => {
    const text = l.description;
    const dest = /ludesch/i.test(text) ? 'ludesch' : /elsbethen|salzburg|fuschl/i.test(text) ? 'elsbethen' : '';
    const real = l.start && l.end ? duration(l) : null;
    const suggest = dest === 'elsbethen' ? 1 : dest === 'ludesch' && real ? Math.round(real * 0.5 * 4) / 4 : null;
    return { l, i, dest, real, suggest };
  });
}
// the Red Bull ticket to put travel on: the trip's own if it is Red Bull, else the day's main Red Bull ticket
function travelTicket(d, l) {
  if (l.ticket && isRb(l.project)) return { ticket: l.ticket, project: l.project };
  const by = new Map();
  for (const x of d.lines) if (!x.skip && x.ticket && isRb(x.project) && x.activity !== 'travel') by.set(x.ticket, { ticket: x.ticket, project: x.project, h: (by.get(x.ticket)?.h ?? 0) + hours(x) });
  const top = [...by.values()].sort((a, b) => b.h - a.h)[0];
  if (top) return top;
  const recent = catalog.find((r) => isRb(r[0]));
  return recent ? { ticket: recent[1], project: recent[0] } : null;
}
function travelHtml(d, editable) {
  const trips = tripsOf(d);
  if (!trips.length) return '';
  const work = d.lines.filter((l) => !l.skip && l.ticket && isRb(l.project) && l.activity !== 'travel' && !TRIP.test(l.description || '')).reduce((s, l) => s + hours(l), 0);
  const travel = trips.reduce((s, t) => s + (t.suggest ?? 0), 0);
  let html = `<section class="travel"><div class="travel-head">🚆 ${T('Día de viaje a Red Bull', 'Red Bull travel day')}</div>`;
  for (const t of trips) {
    const tk = travelTicket(d, t.l);
    const place = t.dest === 'ludesch' ? 'Ludesch' : 'Elsbethen';
    const done = t.l.activity === 'travel' && typeof t.l.hours === 'number' && Math.abs(t.l.hours - (t.suggest ?? -1)) < 0.01 && tk && t.l.ticket === tk.ticket && t.l.place === place;
    const what = t.dest === 'elsbethen'
      ? T('Elsbethen: se reserva <b>1 h por trayecto</b>, dure lo que dure.', 'Elsbethen: book <b>1 h per trip</b>, however long it took.')
      : t.dest === 'ludesch'
        ? T(`Ludesch: <b>50 %</b> del viaje${t.real ? ` (${num(t.real)} h en el calendario)` : ''}, solo de la parte que <b>no</b> trabajaste en el tren. Si trabajaste, reserva esas horas como chargeable y el 50 % del resto como viaje.`,
            `Ludesch: <b>50 %</b> of the trip${t.real ? ` (${num(t.real)} h in the calendar)` : ''}, only of the part you did <b>not</b> work on the train. Hours you worked go in as chargeable, 50 % of the rest as travel.`)
        : T('No sé si es Elsbethen (1 h por trayecto) o Ludesch (50 % del viaje no trabajado): toca el viaje para elegir las horas.', "I can't tell if it's Elsbethen (1 h per trip) or Ludesch (50 % of the unworked trip): tap the trip to set the hours.");
    html += `<div class="trip"><div class="trip-name">${esc(t.l.description)}${t.l.start ? ` · ${t.l.start}–${t.l.end}` : ''}</div><div class="trip-rule">${what}</div>`;
    if (t.suggest != null && tk) {
      html += `<div class="trip-do"><span>${T('Sugerencia', 'Suggestion')}: <b>${num(t.suggest)} h</b> · Travel Time (Red Bull) · <b>${esc(tname(tk.ticket))}</b></span>`
        + (done ? `<span class="ok">✓ ${T('aplicado', 'applied')}</span>` : editable ? `<button class="btn quiet sm" data-trip="${d.date}|${t.i}|${t.suggest}|${esc(tk.ticket)}|${esc(tk.project)}|${t.real ?? ''}|${place}">${T('Aplicar', 'Apply')}</button>` : '')
        + '</div>';
    }
    html += '</div>';
  }
  if (travel) {
    const where = trips.some((t) => t.dest === 'ludesch') ? 'Ludesch' : 'Elsbethen';
    html += `<div class="trip-sum">${T('En CPM', 'In CPM')}: <b>${num(work)} h</b> chargeable + <b>${num(travel)} h</b> Travel Time (Red Bull), ${T('con Einsatzort', 'with Einsatzort')} <b>${where}</b>.<br>${T('En el sistema de RB (Workfront)', 'In the RB system (Workfront)')}: <b>${num(work + travel)} h ${T('como ONSITE', 'as ONSITE')}</b>${T(' (trabajo + viaje).', ' (work + travel).')}</div>`;
  }
  html += `<div class="trip-src">${T('Según el email “Korrektes Buchen der Stunden bei RB” (Michaela Matejková, 17.03.2026).', 'Per the email “Korrektes Buchen der Stunden bei RB” (Michaela Matejková, 17.03.2026).')}</div></section>`;
  return html;
}

// She never uses CPM's numbers: projects without their code, tickets by name.
const pname = (name) => String(name ?? '').trim().replace(/^\d{3,4}(-[\w]+)?\s+/, '');
const tname = (ticket, subject) => subject || subjectOf(ticket) || ticket;
// a ticket's name: from the VM's snapshot, else whatever list the app already has
function subjectOf(ticket, known) {
  if (known) return known;
  const c = catalog.find((r) => r[1] === ticket); if (c?.[2]) return c[2];
  for (const t of Object.values(ticketsByProject)) { const r = t.rows.find((x) => x[0] === ticket); if (r) return r[1]; }
  return '';
}

function meetingHtml(d, l, i, editable) {
  const kind = l.skip ? 'off' : !l.ticket ? 'none' : l.tentative ? 'unsure' : 'ok';
  const edited = typeof l.hours === 'number';
  const tags = l.skip ? `<span class="tag">${T('No se reserva', 'Not booked')}</span>`
    : l.ticket ? `${l.activity === 'travel' ? `<span class="tag trav">🚆 ${isRb(l.project) ? T('viaje RB', 'RB travel') : T('viaje externo', 'external travel')}</span>` : ''}<span class="proj" title="${esc(pname(l.project))}">${esc(subjectOf(l.ticket, l.subject) || pname(l.project) || l.ticket)}${l.chargeable === false && l.activity !== 'travel' ? T(' · no fact.', ' · non-bill.') : ''}</span>`
    : `<span class="tag red">${T('Sin ticket', 'No ticket')}</span><span class="proj">${T('toca para asignar', 'tap to assign')}</span>`;
  // a div, not a button: the card holds its own ✕ / ↺ button
  const attrs = editable ? `data-line="${d.date}|${i}" role="button" tabindex="0"` : '';
  const remove = !editable ? ''
    : l.skip ? `<button class="rm undo" data-restore="${d.date}|${i}" aria-label="${T('Volver a incluir', 'Include again')}">↺</button>`
    : `<button class="rm" data-remove="${d.date}|${i}" aria-label="${T('Quitar de la reserva', 'Remove from booking')}">✕</button>`;
  return `<div class="mt ${kind}${editable ? ' has-rm' : ' static'}" ${attrs}>
    <div class="t">${l.manual ? `<b>＋</b><span>${T('a mano', 'manual')}</span>` : `<b>${l.start}</b><span${l.plannedEnd ? ` class="real" title="${T('real time; planeado hasta', 'real time; planned until')} ${l.plannedEnd}"` : ''}>${l.end}${l.plannedEnd ? ' ⏱' : ''}</span>`}</div>
    <div class="title">${esc(l.description) || `<span style="color:var(--muted)">${T('(sin comentario)', '(no comment)')}</span>`}</div>
    <div class="h${edited ? ' edited' : ''}">${l.skip ? '–' : num(hours(l))}<small>${edited ? T('editado', 'edited') : 'h'}</small></div>
    <div class="tags">${tags}</div>
    ${remove}
  </div>`;
}

    html += `<div class="empty"><b>${T('Todavía no hay borradores', 'No drafts yet')}</b>${T('Llegan de lunes a viernes a las 17:30, o elige un día arriba.', 'They arrive Monday to Friday at 17:30, or pick a day above.')}</div>`;
  } else if (!d) {
    html += requested[current] && Date.now() - requested[current] > VM_PATIENCE

      : `<div class="empty"><b>${dayLabel(current)}</b>${T('Sin borrador todavía.', 'No draft yet.')}<br><br><button class="btn quiet" data-ask="${current}">${T('Pedir a la VM', 'Ask the VM')}</button></div>`;

    html += travelHtml(d, editable);
    if ((saving[d.date] || pending[d.date]) && Date.now() - (waitSince[d.date] ?? Date.now()) > VM_PATIENCE) html += vmSilentHtml(d.date);
    else if (saving[d.date]) html += `<div class="banner blue"><span>⏳</span><span>${T('Guardando tus cambios en la VM…', 'Saving your changes on the VM…')}</span></div>`;

      d.lines.forEach((l, i) => { html += meetingHtml(d, l, i, editable); });
      html += '</div>';

    // add hours by hand: to a day under review, or on top of a day with no meetings / already in CPM
    if (editable || ['empty', 'already', 'booked', 'partial'].includes(d.status)) {

    }
    if (d.topUp && d.inCpm?.length) {
      html += `<div class="section"><h2>${T('Ya en CPM', 'Already in CPM')}</h2><span>${num(d.inCpm.reduce((s, e) => s + e.hours, 0))} h</span></div><div class="rows">`;

      html += '</div>';

    if (d.status === 'already' && d.entries.length) {

      for (const e of d.entries) html += `<div><span>${esc(tname(e.ticket, e.subject))} · ${esc(pname(e.project))}</span><b>${num(e.hours)} h</b></div>`;
      html += '</div>';
    }
    if (d.results?.length) {
      html += `<div class="section"><h2>${T('Resultado', 'Result')}</h2></div><div class="rows">`;
      for (const r of d.results) html += `<div class="${r.ok ? '' : 'bad'}"><span>${r.ok ? '✓' : '✗'} ${esc(tname(r.ticket))}${r.ok ? '' : ' · ' + esc(r.error)}</span><b>${num(r.hours)} h</b></div>`;
      html += '</div>';
    }
  }

  html += `<button class="link" id="copilot" ${copilot ? '' : 'disabled'}><span>✏️&nbsp; ${T('Abrir el Copilot', 'Open the Copilot')}<br><small>${copilot ? T('para cambios más grandes', 'for bigger changes') : T('el enlace llega con ↻', 'the link arrives with ↻')}</small></span>›</button>`;

  const others = sorted.filter((x) => x.date !== current).slice(0, 10);
  if (others.length) {
    html += `<details class="others"${renderOthersOpen ? ' open' : ''}><summary class="section"><h2>${T('Otros días', 'Other days')} ▾</h2><span>${others.length}</span></summary><div class="rows">`;
    for (const x of others) {
      const [, label] = STATUS[x.status] ?? ['off', x.status];
      html += `<div data-select="${x.date}"><span>${dayLabel(x.date)} · <span style="color:var(--muted)">${label}</span></span><b>${num(totalOf(x))} h</b></div>`;
    }
    html += '</div></details>';
  }
  main.innerHTML = html;
  renderBar(d);
  if (current) loadWorkday(current);
}

/* ---------- WF bookings: the month's Red Bull hours, CPM against Workfront ---------- */

// Workfront has no API key: Claude reads it through Chrome and drops a snapshot on the
// VM; the Copilot server compares it with CPM (live). Results are kept per month.
let tab = store.get('tab') === 'wf' ? 'wf' : 'cpm';
let wfMonth = todayIso().slice(0, 7);
let wfData = parse('wfData', {}); // month -> server answer + fetched
const wfLoading = new Set();
const shiftMonth = (m, by) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + by, 1); return iso(d).slice(0, 7); };
const monthLabel = (m) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleString(lang === 'en' ? 'en' : 'es', { month: 'long', year: 'numeric' }); };
const KIND = {
  missing: ['Falta en Workfront', 'Not in Workfront'], extra: ['Solo en Workfront', 'Only in Workfront'],
  hours: ['Horas distintas', 'Hours differ'], date: ['Otro día', 'Different day'],
  task: ['Otra task', 'Different task'], comment: ['Comentario distinto', 'Comment differs'],
};

async function loadWf(month, force = false) {
  if (!copilot || !searchKey || wfLoading.has(month)) return;
  const known = wfData[month];
  if (known && !force && Date.now() - known.fetched < 10 * 60e3) return;
  wfLoading.add(month); if (tab === 'wf') render();
  try {
    const r = await fetch(`${copilot}/wf?month=${month}${force ? '&refresh=1' : ''}`, { headers: { 'x-copilot-key': searchKey }, signal: AbortSignal.timeout(90000) });
    const body = await r.json();
    wfData[month] = r.ok ? { ...body, fetched: Date.now() } : { error: body.error || r.status, fetched: Date.now() };
    const keep = Object.keys(wfData).sort().slice(-6);
    wfData = Object.fromEntries(keep.map((k) => [k, wfData[k]]));
    store.set('wfData', JSON.stringify(wfData));
  } catch {
    wfData[month] = { ...(wfData[month] ?? {}), error: T('No pude hablar con la VM.', "Couldn't reach the VM."), fetched: Date.now() };
  } finally { wfLoading.delete(month); if (tab === 'wf') render(); }
}

function renderWf(main) {
  const m = wfMonth, w = wfData[m], busy = wfLoading.has(m);
  let html = `<div class="month"><button class="round" data-wfm="-1" aria-label="${T('Mes anterior', 'Previous month')}">‹</button>
    <b>${monthLabel(m)}</b>
    <button class="round" data-wfm="1" aria-label="${T('Mes siguiente', 'Next month')}" ${m >= todayIso().slice(0, 7) ? 'disabled' : ''}>›</button></div>`;
  if (!copilot || !searchKey) {
    main.innerHTML = html + `<div class="empty"><b>${T('Falta conectar', 'Not connected yet')}</b>${T('Pulsa ↻ para recibir el enlace del Copilot.', 'Tap ↻ to get the Copilot link.')}</div>`;
    return;
  }
  if (!w || (busy && !w.days)) {
    main.innerHTML = html + `<div class="skeleton"></div><p class="note" style="text-align:center">${T('Leyendo CPM y Workfront…', 'Reading CPM and Workfront…')}</p>`;
    if (!w) loadWf(m);
    return;
  }
  if (w.error && !w.days) {
    main.innerHTML = html + `<div class="empty"><b>${T('No se pudo cargar', "Couldn't load")}</b>${esc(w.error)}<br><br><button class="btn quiet" data-wfreload>${T('Reintentar', 'Try again')}</button></div>`;
    return;
  }
  const diff = round2(w.totals.wf - w.totals.cpm);
  const read = w.workfront?.fetchedAt ? new Date(w.workfront.fetchedAt).toLocaleString(lang === 'en' ? 'en' : 'es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  html += `<section class="hero wf"><div class="hero-top"><span>Red Bull</span>
      <span class="hero-pill">${!w.workfront ? T('Sin Workfront', 'No Workfront') : diff === 0 && !w.issues?.length ? T('Todo cuadra', 'All matches') : `${w.issues.length} ${T('diferencias', 'differences')}`}</span></div>
    <div class="vs"><div><small>CPM</small><b>${num(w.totals.cpm)}</b> h</div><div><small>Workfront</small><b>${w.workfront ? num(w.totals.wf) : '–'}</b>${w.workfront ? ' h' : ''}</div></div>
    <div class="workday">${w.workfront ? `${T('Workfront leído el', 'Workfront read')} ${read}${diff ? ` · ${T('diferencia', 'difference')} ${diff > 0 ? '+' : ''}${num(diff)} h` : ''}` : T('Todavía no hay snapshot de Workfront para este mes.', 'No Workfront snapshot for this month yet.')}</div>
  </section>`;
  if (!w.workfront) {
    html += `<div class="banner blue"><span>💬</span><span>${T('Para comparar, pídele a Claude:', 'To compare, ask Claude:')} <b>“Refresh the Workfront snapshot for ${m}”</b></span></div>`;
  }
  if (w.issues?.length) {
    html += `<div class="section"><h2>${T('Qué cambiar en Workfront', 'What to change in Workfront')}</h2><span>${w.issues.length}</span></div><div class="list">`;
    for (const i of w.issues) {
      html += `<div class="issue"><span class="k ${i.kind}">${T(...(KIND[i.kind] ?? [i.kind, i.kind]))}</span><div>${esc(i.text)}</div></div>`;
    }
    html += '</div>';
  }
  if (w.days?.length) {
    html += `<div class="section"><h2>${T('Por día', 'By day')}</h2></div><div class="rows daytbl">
      <div class="head"><span>${T('Día', 'Day')}</span><b>CPM</b><b>WF</b><span></span></div>`;
    for (const d of w.days) {
      const same = !w.workfront || Math.abs(d.cpm - d.wf) < 0.01;
      html += `<div><span>${dayLabel(d.date)}</span><b>${num(d.cpm)}</b><b>${w.workfront ? num(d.wf) : '–'}</b><span class="${same ? 'ok' : 'no'}">${w.workfront ? (same ? '✓' : '≠') : ''}</span></div>`;
    }
    html += '</div>';
  } else {
    html += `<div class="empty"><b>${T('Sin horas de Red Bull', 'No Red Bull hours')}</b>${T('No hay reservas de Red Bull en CPM este mes.', 'No Red Bull bookings in CPM this month.')}</div>`;
  }
  if (busy) html += `<p class="note" style="text-align:center">${T('Actualizando…', 'Updating…')}</p>`;
  main.innerHTML = html;
  loadWf(m);
}

function renderBar(d) {
  const bar = $('#bar');
  if (!d || !['pending', 'skipped', 'blocked'].includes(d.status)) { bar.classList.remove('show'); return; }
  const wait = pending[d.date] || (saving[d.date] && 'save');
  if (d.status === 'pending') {
    bar.innerHTML = `<button class="btn quiet" data-skip="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'skip' ? T('Saltando…', 'Skipping…') : T('Saltar', 'Skip')}</button>
      <button class="btn primary" data-approve="${d.date}" ${wait || !d.entries.length ? 'disabled' : ''}>${wait === 'approve' ? T('Reservando…', 'Booking…') : wait === 'save' ? T('Guardando…', 'Saving…') : `${T('Reservar', 'Book')} ${num(totalOf(d))} h`}</button>`;
  } else {
    bar.innerHTML = `<button class="btn primary" data-reopen="${d.date}" ${wait ? 'disabled' : ''}>${wait === 'reopen' ? T('Reabriendo…', 'Reopening…') : T('↩︎ Reabrir para revisar', '↩︎ Reopen to review')}</button>`;
  }
  bar.classList.add('show');
}

function renderSetup(main) {
  main.innerHTML = `<div class="setup"><b>${T('Falta conectar la app', 'The app is not connected yet')}</b>
    <p class="note">${T('Abre esta página con el enlace que te dio Claude (el que termina en <code>#d=…&amp;r=…</code>), o pégalo aquí:', 'Open this page with the link Claude gave you (the one ending in <code>#d=…&amp;r=…</code>), or paste it here:')}</p>
    <input id="link" placeholder="https://…#d=…&r=…" autocomplete="off">
